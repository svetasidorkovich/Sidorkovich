<style>
:root{
  --bg:#F5EFE7;--surface:#FFFCF7;--ink:#2A2230;--muted:#8C8189;--line:#E9E0D6;
  --accent:#6E3F8A;--on-accent:#fff;--accent-soft:#EFE5F4;--peach:#E3926B;--ok:#4F9470;--danger:#C2534B;
  --n-cream:#FFF4D9;--n-peach:#FCE1D3;--n-mint:#DCEFE2;--n-lav:#E9E0F6;--n-sky:#DBEAF7;--n-rose:#F8DCE5;
  --shadow:0 1px 2px rgba(42,34,48,.05),0 10px 28px rgba(42,34,48,.07);
  --display:"Playfair Display",Georgia,serif;--hand:"Caveat",cursive;--body:Manrope,system-ui,sans-serif;--content:var(--body);
  --r:20px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html.dark{
  --bg:#16121A;--surface:#211B26;--ink:#F2EBF1;--muted:#9D909A;--line:#322938;
  --accent:#C9A0E2;--on-accent:#1B1420;--accent-soft:#33283D;--peach:#F0A985;--ok:#7CC49B;--danger:#E8796F;
  --n-cream:#38311F;--n-peach:#3F2D26;--n-mint:#22352A;--n-lav:#30283F;--n-sky:#213242;--n-rose:#3E2633;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 120px)}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05;margin:2px 0 4px;letter-spacing:-.5px}
.hello{font-size:14px;color:var(--muted);font-weight:600;max-width:54%}
.sub{color:var(--muted);font-size:15px}
.sub em{font-family:var(--display);font-style:italic;color:var(--accent)}
.top{position:relative;margin-bottom:16px}
.tr{position:absolute;right:0;top:-4px;display:flex;align-items:center;gap:8px;max-width:46%;justify-content:flex-end}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;text-align:right;line-height:1.25}
.gear{width:38px;height:38px;border-radius:13px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.gear svg{width:20px;height:20px}
html[data-font=serif]{--body:"Lora",Georgia,serif}
html[data-font=hand]{--display:"Caveat",cursive;--content:"Caveat",cursive}
html[data-font=sans]{--display:Manrope,system-ui,sans-serif}
html[data-font=soft]{--display:"Comfortaa",system-ui,sans-serif;--body:"Comfortaa",system-ui,sans-serif}
html[data-font=soft] h1{font-size:32px;letter-spacing:-.5px}
html[data-font=soft] .sub em,html[data-font=soft] .calhead .yr,html[data-font=soft] .empty b{font-style:normal;font-weight:700}
.ttl,.note h3,.note p,.nr .nt,.nr .np,.f-body,.quick input{font-family:var(--content)}
html[data-font=hand] .ttl{font-size:22px;font-weight:700;line-height:1.1}
html[data-font=hand] .note h3{font-size:23px}
html[data-font=hand] .note p,html[data-font=hand] .nr .np{font-size:19px;line-height:1.15}
html[data-font=hand] .nr .nt{font-size:21px}
html[data-font=hand] .f-body,html[data-font=hand] .quick input{font-size:20px}
html[data-font=hand] h1{font-size:48px;letter-spacing:0}
html[data-font=hand] .f-title{font-size:34px}
html[data-font=hand] .sub em,html[data-font=hand] .empty b{font-style:normal;font-size:22px}
html[data-font=sans] h1{font-weight:800;letter-spacing:-1.2px}
html[data-font=sans] .sub em,html[data-font=sans] .calhead .yr,html[data-font=sans] .empty b{font-style:normal;font-weight:700}

/* stickers */
.seg.sm{margin-bottom:16px}.seg.sm button{padding:7px 4px;font-size:13px}
.wkhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin:14px 0 26px}
.stk{position:relative;padding:22px 14px 12px;min-height:150px;border-radius:3px 3px 16px 3px;box-shadow:0 1px 2px rgba(40,30,20,.08),0 14px 22px -10px rgba(40,30,20,.3);transform:rotate(var(--rot,0deg));display:flex;flex-direction:column;color:var(--ink)}
.stk:nth-child(4n+1){--rot:-1.6deg}.stk:nth-child(4n+2){--rot:1.3deg}.stk:nth-child(4n+3){--rot:.9deg}.stk:nth-child(4n){--rot:-1.1deg}
.stk .tape{position:absolute;top:-10px;left:50%;width:64px;height:21px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--surface) 60%,transparent);border:1px solid color-mix(in srgb,var(--ink) 7%,transparent)}
.stk.today{outline:2.5px solid var(--accent);outline-offset:4px}
.stk .sh{font-family:var(--hand);font-size:25px;font-weight:700;line-height:1;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;overflow-wrap:anywhere}
.stk .sh small{font-family:Manrope;font-size:12px;font-weight:700;opacity:.55;flex:none}
.stk ul{list-style:none;margin:0;padding:0;flex:1}
.stk li{display:flex;gap:7px;align-items:flex-start;font-family:var(--hand);font-size:20px;line-height:1.1;padding:3px 0}
.stk .bx{width:17px;height:17px;border:1.8px solid currentColor;border-radius:5px;flex:none;margin-top:2px;opacity:.55;display:grid;place-items:center;cursor:pointer}
.stk .bx svg{width:12px;height:12px}
.stk li.done .bx{opacity:1;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stk li.done .tx{text-decoration:line-through;opacity:.45}
.stk li.p2 .tx{color:var(--danger)}
.stk .tx{flex:1;overflow-wrap:anywhere;cursor:pointer}
.stk .tx small{font-family:Manrope;font-size:11px;font-weight:700;opacity:.6;margin-right:4px}
.stk .sn{font-family:var(--hand);font-size:19px;opacity:.8;padding:2px 0;cursor:pointer;overflow-wrap:anywhere}
.stk .sadd{align-self:flex-start;font-family:var(--hand);font-size:19px;opacity:.5;margin-top:6px}
.stk .none{font-family:var(--hand);font-size:19px;opacity:.4;padding:2px 0}
.nstk{cursor:pointer;min-height:140px}
.nstk .sh{display:block;padding-right:14px}
.nstk .sb{font-family:var(--hand);font-size:20px;line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;opacity:.85;flex:1}
.nstk .sf{font-size:12px;font-weight:700;opacity:.55;margin-top:8px;display:flex;justify-content:space-between}
.nstk .pin{position:absolute;top:10px;right:10px;width:15px;height:15px;color:var(--accent)}
/* notes list */
.nr{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.nr:last-child{border-bottom:0}
.nr .cd{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.nr .mid{flex:1;min-width:0}
.nr .nt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr .np{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr .nd{font-size:12px;color:var(--muted);flex:none;margin-top:3px;font-weight:600}
/* settings */
.stitle{font-family:var(--display);font-size:28px;font-weight:700}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th,.opt{background:var(--surface);border-radius:16px;padding:12px 6px 10px;box-shadow:var(--shadow);text-align:center;font-size:13px;font-weight:700;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:7px}
.th.on,.opt.on{border-color:var(--accent);color:var(--accent)}
.th .s3{display:flex}
.th .s3 i{width:24px;height:24px;border-radius:50%;margin:0 -4px;border:2px solid var(--surface)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt .pv{font-size:26px;line-height:1;height:30px;display:grid;place-items:center;color:var(--ink)}
.opt .pv svg{width:26px;height:26px}
.opt>svg{width:20px;height:20px}
label.opt{cursor:pointer}
.bk{font-size:14px;color:var(--muted);margin:0 4px 12px;line-height:1.45}.bk span{font-weight:700;color:var(--ink)}
.sync svg{width:16px;height:16px;flex:none}
.sync.ok{color:var(--ok)}

/* week strip */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -18px 18px;padding:4px 18px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;padding:10px 0 9px;border-radius:16px;background:var(--surface);text-align:center;scroll-snap-align:center;box-shadow:var(--shadow);position:relative}
.day .w{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.day .n{font-size:19px;font-weight:700;margin-top:2px}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--peach);margin:4px auto 0;opacity:0}
.day.has .dot{opacity:1}
.day.today .n{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.sel .w,.day.sel .n{color:var(--on-accent)}
.day.sel .dot{background:var(--on-accent)}

/* progress */
.prog{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.prog svg{flex:none}
.prog .big{font-weight:800;font-size:17px}
.prog .small{color:var(--muted);font-size:14px}

/* quick add */
.quick{display:flex;gap:8px;margin-bottom:22px}
.quick input{flex:1;min-width:0;border:1.5px dashed var(--line);background:transparent;border-radius:16px;padding:13px 16px;outline:none}
.quick input:focus{border-style:solid;border-color:var(--accent);background:var(--surface)}
.quick button{width:50px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.quick button svg{width:22px;height:22px}

/* sections */
.sec{margin-bottom:24px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 10px 4px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec h2 .c{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:1px 8px;font-size:12px;letter-spacing:0}
.sec.danger h2{color:var(--danger)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.empty{padding:22px 18px;color:var(--muted);text-align:center;font-size:15px}
.empty b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:20px;color:var(--ink);margin-bottom:4px}

/* task row */
.task{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.task.p1 .check{border-color:var(--peach)}
.task.p2 .check{border-color:var(--danger)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}
.tb{flex:1;min-width:0}
.ttl{font-weight:600;overflow-wrap:anywhere}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.meta .tag{color:var(--accent);font-weight:600}
.flag{font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;flex:none}
.flag.p1{background:var(--n-peach);color:var(--peach)}
.flag.p2{background:var(--n-rose);color:var(--danger)}

/* notes */
.grid{columns:2;column-gap:10px}
.note{break-inside:avoid;margin-bottom:10px;border-radius:18px;padding:14px 14px 12px;cursor:pointer;position:relative;background:var(--n-cream)}
.c-cream{background:var(--n-cream)}.c-peach{background:var(--n-peach)}.c-mint{background:var(--n-mint)}.c-lav{background:var(--n-lav)}.c-sky{background:var(--n-sky)}.c-rose{background:var(--n-rose)}
.note h3{margin:0 0 6px;font-size:16px;font-weight:700;overflow-wrap:anywhere;padding-right:16px}
.note p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.note .nm{font-size:12px;margin-top:10px;display:flex;justify-content:space-between;gap:6px;opacity:.7;font-weight:600}
.note .pin{position:absolute;top:12px;right:11px;width:15px;height:15px;color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:transparent;outline:none;padding:13px 0;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h1{font-size:32px}
.calhead .yr{font-family:var(--display);font-style:italic;color:var(--muted);font-weight:500}
.nav2{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.cal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 10px 10px;margin-bottom:22px}
.cal .wh,.cal .cells{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wh div{font-size:11px;font-weight:800;color:var(--muted);padding-bottom:8px;text-transform:uppercase}
.cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;font-weight:600;position:relative}
.cell.out{opacity:.3}
.cell.today{color:var(--accent);font-weight:800}
.cell.sel{background:var(--accent);color:var(--on-accent)}
.cell .ds{display:flex;gap:3px;height:5px;margin-top:3px}
.cell .ds i{width:5px;height:5px;border-radius:50%;background:var(--peach)}
.cell .ds i.nt{background:var(--accent)}
.cell.sel .ds i{background:var(--on-accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);justify-content:center;margin-top:8px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--peach)}
.legend i.nt{background:var(--accent)}

.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:18px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}

/* bottom nav + fab */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(var(--sab) + 10px);pointer-events:none}
.bnav .in{max-width:520px;margin:0 auto;display:flex;align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 10px 34px rgba(30,20,40,.16);padding:6px;pointer-events:auto}
.bnav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;color:var(--muted);font-size:11px;font-weight:700}
.bnav .t svg{width:22px;height:22px}
.bnav .t.on{color:var(--accent);background:var(--accent-soft)}
.fab{width:54px;height:54px;flex:none;border-radius:19px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 6px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:26px;height:26px}

/* sheet */
.back{position:fixed;inset:0;background:rgba(20,12,26,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(var(--sab) + 18px)}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shead .x{font-weight:700;color:var(--muted);padding:8px 2px}
.shead .save{background:var(--accent);color:var(--on-accent);font-weight:800;padding:10px 20px;border-radius:14px}
.f-title{width:100%;border:2px solid var(--accent);background:var(--surface);border-radius:16px;outline:none;font-family:var(--display);font-size:24px;font-weight:700;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.f-title::placeholder{color:var(--muted);opacity:.8}
.f-body.short{min-height:64px}
.f-body{width:100%;border:0;background:var(--surface);border-radius:16px;outline:none;padding:14px;min-height:110px;resize:none;box-shadow:var(--shadow);line-height:1.5}
.fl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 4px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.inp{flex:1;min-width:130px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.inp input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:12px 0;font-weight:600}
.inp svg{width:18px;height:18px;color:var(--muted);flex:none}
.inp .clr{color:var(--muted);font-size:20px;line-height:1;padding:4px}
.quickdates{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qd{padding:7px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.qd.on{background:var(--ink);color:var(--bg)}
.swatches{display:flex;gap:12px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-weight:600;margin-top:18px}
.sw-t{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on{background:var(--accent)}
.sw-t.on::after{left:21px}
.del{margin-top:26px;width:100%;padding:14px;border-radius:14px;color:var(--danger);font-weight:700;background:var(--surface);box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;gap:16px;align-items:center;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--peach);font-weight:800}
@media (max-width:360px){h1{font-size:32px}.day{width:46px}}
</style>
</head>
<body>
<div class="app" id="main"></div>

<nav class="bnav"><div class="in">
  <button class="t" data-tab="today"><span data-i="sun"></span>Сегодня</button>
  <button class="t" data-tab="calendar"><span data-i="cal"></span>Календарь</button>
  <button class="fab" id="fab" aria-label="Добавить"><span data-i="plus"></span></button>
  <button class="t" data-tab="notes"><span data-i="note"></span>Заметки</button>
  <button class="t" data-tab="tasks"><span data-i="list"></span>Задачи</button>
</div></nav>

<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">Вернуть</button></div>

<script>
/* ---------- icons ---------- */
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
  sun:sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  cal:sv('<rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>'),
  note:sv('<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8.5 12h7M8.5 16h5"/>'),
  list:sv('<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>'),
  plus:sv('<path d="M12 5v14M5 12h14"/>'),
  check:sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  left:sv('<path d="m15 18-6-6 6-6"/>'),
  right:sv('<path d="m9 18 6-6-6-6"/>'),
  search:sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  clock:sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  tag:sv('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>'),
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5-1-1 5-5-4-4 1.5-1.5L10 10l4-4z"/></svg>',
  cloud:sv('<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/><path d="m9.5 13.5 2 2 3.5-3.5"/>'),
  phone:sv('<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M11 18h2"/>'),
  gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  grid:sv('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  sticky:sv('<path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/>'),
  down:sv('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
  up:sv('<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'),
  rows:sv('<path d="M4 6h16M4 12h16M4 18h16"/>'),
};
document.querySelectorAll('[data-i]').forEach(e=>e.outerHTML=I[e.dataset.i]);

/* ---------- dates ---------- */
const MON_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>key(new Date());
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const wd=d=>(d.getDay()+6)%7;
function human(k){
  const t=todayKey();
  if(k===t)return 'Сегодня';
  if(k===addDays(t,1))return 'Завтра';
  if(k===addDays(t,-1))return 'Вчера';
  const d=parse(k);
  return `${d.getDate()} ${MON_G[d.getMonth()]}, ${WD[wd(d)].toLowerCase()}`;
}
const shortDate=k=>{const d=parse(k);return `${d.getDate()} ${MON_G[d.getMonth()].slice(0,3)}`};
function greet(){const h=new Date().getHours();return h<5?'Доброй ночи, Света':h<12?'Доброе утро, Света':h<18?'Добрый день, Света':'Добрый вечер, Света'}

/* ---------- utils ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const NOTE_COLORS=['cream','peach','mint','lav','sky','rose'];
const PRIO=['Обычно','Важно','Срочно'];

/* ---------- state ---------- */
const items=new Map();
const S={view:'today',sel:todayKey(),cal:null,q:'',tag:null,tf:'upcoming'};
{const d=new Date();S.cal=new Date(d.getFullYear(),d.getMonth(),1)}
try{const v=localStorage.getItem('planner_view');if(['today','calendar','notes','tasks'].includes(v))S.view=v}catch(e){}

/* ---------- appearance settings ---------- */
const THEMES={
  plum:{n:'Слива',l:['#6E3F8A','#EFE5F4','#F5EFE7'],d:['#C9A0E2','#33283D']},
  peach:{n:'Персик',l:['#C0603A','#FBE5DA','#FAF1EA'],d:['#F2A684','#3E2A22']},
  mint:{n:'Мята',l:['#2F7A60','#DCEFE6','#EEF3EE'],d:['#80CBAE','#203A31']},
  ocean:{n:'Океан',l:['#2D5C9C','#DEE8F6','#EEF2F7'],d:['#8FB5EA','#21304A']},
  rose:{n:'Роза',l:['#AE3A68','#F8DDE8','#FAF0F2'],d:['#F08DB5','#432639']},
  graphite:{n:'Графит',l:['#2B2A30','#E7E5E1','#F2F1EE'],d:['#E8E4DD','#2F2E34']},
};
const SET_DEF={theme:'plum',mode:'auto',font:'serif',calView:'grid',notesView:'cards',ts:0};
const SET={...SET_DEF};
try{Object.assign(SET,JSON.parse(localStorage.getItem('planner_settings')||'{}'))}catch(e){}
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const dark=SET.mode==='dark'||(SET.mode==='auto'&&mq&&mq.matches);
  const r=document.documentElement,st=r.style,t=THEMES[SET.theme]||THEMES.plum;
  r.classList.toggle('dark',!!dark);
  r.dataset.font=SET.font;
  if(dark){st.setProperty('--accent',t.d[0]);st.setProperty('--accent-soft',t.d[1]);st.setProperty('--on-accent','#1B1420');st.removeProperty('--bg')}
  else{st.setProperty('--accent',t.l[0]);st.setProperty('--accent-soft',t.l[1]);st.setProperty('--on-accent','#fff');st.setProperty('--bg',t.l[2])}
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim();
}
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(SET.mode==='auto')applyTheme()});
applyTheme();
function saveSettings(){
  try{localStorage.setItem('planner_settings',JSON.stringify(SET))}catch(e){}
  if(mode==='cloud')remote('_settings',{...SET});
}

const all=()=>[...items.values()];
const tasks=()=>all().filter(i=>i.type==='task');
const notes=()=>all().filter(i=>i.type==='note');
const tasksOn=k=>tasks().filter(t=>t.date===k);
const notesOn=k=>notes().filter(n=>n.date===k);
const label=i=>(i.title&&i.title.trim())||((i.body||'').split('\n').find(x=>x.trim())||'').trim()||'Без названия';
const sortTasks=a=>a.slice().sort((x,y)=>(x.done-y.done)||((x.time||'99')<(y.time||'99')?-1:(x.time||'99')>(y.time||'99')?1:0)||((y.prio||0)-(x.prio||0))||((x.created||0)-(y.created||0)));
const sortNotes=a=>a.slice().sort((x,y)=>((y.pinned?1:0)-(x.pinned?1:0))||((y.updated||0)-(x.updated||0)));

/* ---------- storage: cloud (db) with local fallback ---------- */
let col=null, mode='local', syncState='local';
const LS='planner_v1';
function loadLocal(){try{const a=JSON.parse(localStorage.getItem(LS)||'[]');a.forEach(i=>i&&i.id&&items.set(i.id,i))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(all()))}catch(e){}}
const pend=new Map(),busy=new Set();
function remote(id,val){
  pend.set(id,val);
  if(busy.has(id))return;
  busy.add(id);
  (async()=>{
    while(pend.has(id)){
      const v=pend.get(id);pend.delete(id);
      try{v===null?await col.doc(id).delete():await col.doc(id).set(v)}
      catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{v===null?await col.doc(id).delete():await col.doc(id).set(v)}catch(e2){toast('Не удалось сохранить, проверь интернет')}}
        else if(e&&e.code==='quota_exceeded')toast('Хранилище заполнено — удали старые записи');
        else toast('Не удалось сохранить');
      }
    }
    busy.delete(id);
  })();
}
function put(item){
  item.updated=Date.now();
  items.set(item.id,item);
  if(mode==='cloud')remote(item.id,JSON.parse(JSON.stringify(item)));else saveLocal();
  render();
}
function remove(id){
  items.delete(id);
  if(mode==='cloud')remote(id,null);else saveLocal();
  render();
}

async function initCloud(){
  if(!window.claude||!window.claude.use){setSync('local');return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  const id=user?await user.id():null;
  if(!db||!id){setSync('local');return}
  try{col=db.collection('data/users/'+id)}catch(e){setSync('local');return}
  const localSnapshot=all();
  mode='cloud';setSync('wait');
  let settled=false;
  const timer=setTimeout(()=>{if(!settled)setSync('offline')},10000);
  col.onSnapshot(snap=>{
    items.clear();
    let rs=null;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='_settings'){rs=v;return}items.set(d.id,{...v,id:d.id})});
    if(rs&&!pend.has('_settings')&&!busy.has('_settings')){
      const next={...SET_DEF,...rs};
      if((next.ts||0)>(SET.ts||0)&&JSON.stringify(next)!==JSON.stringify(SET)){Object.assign(SET,next);try{localStorage.setItem('planner_settings',JSON.stringify(SET))}catch(e){};applyTheme()}
    }
    if(!snap.metadata.fromCache&&!settled){
      settled=true;clearTimeout(timer);setSync('ok');
      if((!rs||(rs.ts||0)<(SET.ts||0))&&SET.ts)remote('_settings',{...SET});
      let migrated=false;try{migrated=localStorage.getItem('planner_migrated')==='1'}catch(e){}
      if(!items.size&&localSnapshot.length&&!migrated){
        localSnapshot.forEach(i=>{items.set(i.id,i);remote(i.id,i)});
        try{localStorage.setItem('planner_migrated','1')}catch(e){}
      }
    }
    render();
  },err=>{
    clearTimeout(timer);
    if(err&&err.code==='revoked'){setSync('offline')}
    else{setSync('offline')}
  });
}
function setSync(s){syncState=s;const el=document.getElementById('sync');if(el)el.outerHTML=syncHTML()}
const topRight=()=>`<div class="tr">${syncHTML()}<button class="gear" data-act="settings" aria-label="Оформление">${I.gear}</button></div>`;

function _unusedSync(){
  if(syncState==='ok')return `<div class="sync ok" id="sync" title="Синхронизировано">${I.cloud}</div>`;
  if(syncState==='wait')return `<div class="sync" id="sync">загрузка…</div>`;
  if(syncState==='offline')return `<div class="sync" id="sync">${I.cloud}нет связи — данные могут быть устаревшими</div>`;
  return `<div class="sync" id="sync">${I.phone}только на этом устройстве</div>`;
}

function renderNotes(list,extraStyle=''){

const sec=(title,inner,cls='',count)=>`<section class="sec ${cls}"><h2>${title}${count!=null?`<span class="c">${count}</span>`:''}</h2>${inner}</section>`;
const empty=(b,s)=>`<div class="list"><div class="empty"><b>${b}</b>${s||''}</div></div>`;
function ring(done,total){
  const r=24,c=2*Math.PI*r,p=total?done/total:0;
  return `<svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" stroke="var(--line)" stroke-width="7" fill="none"/>
  <circle cx="30" cy="30" r="${r}" stroke="var(--accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 30 30)" style="transition:stroke-dashoffset .4s"/>
  <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)" font-family="Manrope">${Math.round(p*100)}%</text></svg>`;
}
function progressText(done,total){
  if(!total)return ['Свободный день','Добавь задачи или просто отдохни'];
  if(done===total)return ['Всё сделано! 🎉',`${total} из ${total} задач выполнено`];
  const left=total-done;
  return [`Осталось ${left} ${plural(left,'задача','задачи','задач')}`,`${done} из ${total} выполнено`];
}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c}

function viewToday(){
  const d=parse(S.sel),isToday=S.sel===todayKey();

function viewCalendar(){
  if(SET.calView==='stickers')return viewWeek();
  const m=S.cal,y=m.getFullYear(),mo=m.getMonth();
  const start=new Date(y,mo,1-wd(m));
  const tk=new Map(),nk=new Set();
  tasks().forEach(t=>{if(t.date&&!t.done)tk.set(t.date,(tk.get(t.date)||0)+1)});
  notes().forEach(n=>{if(n.date)nk.add(n.date)});
  let cells='';
  for(let i=0;i<42;i++){

    if(i>=35&&d.getMonth()!==mo)break;
    cells+=`<button class="cell ${d.getMonth()!==mo?'out':''} ${k===todayKey()?'today':''} ${k===S.sel?'sel':''}" data-act="cday" data-k="${k}">${d.getDate()}<span class="ds">${tk.has(k)?'<i></i>':''}${nk.has(k)?'<i class="nt"></i>':''}</span></button>`;
  }
  const tl=sortTasks(tasksOn(S.sel)),nl=sortNotes(notesOn(S.sel));

const notesSwitch=()=>segSm('notesv',SET.notesView,[['cards','Карточки'],['stickers','Стикеры'],['list','Список']]);
const STK_COLORS=['cream','peach','mint','lav','sky','rose','peach'];

function viewNotes(){

  return `<header class="top">${topRight()}<div class="hello">Всё важное в одном месте</div><h1>Заметки</h1></header>

function notesOut(){

  if(!nl.length)return empty(notes().length?'Ничего не нашлось':'Здесь будут твои мысли',notes().length?'Попробуй другой запрос':'Нажми «+», чтобы написать первую заметку');

function viewTasks(){
  const F=[['upcoming','Впереди'],['nodate','Без даты'],['all','Все'],['done','Готово']];
  const t=todayKey();let body='';
  const tl=tasks();
  if(S.tf==='upcoming'){
    const up=tl.filter(x=>!x.done&&x.date);
    const groups=new Map();
    sortTasks(up).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(x=>{const g=x.date<t?'__over':x.date;if(!groups.has(g))groups.set(g,[]);groups.get(g).push(x)});
    if(!groups.size)body=empty('Впереди пусто','Запланируй что-нибудь приятное');
    for(const [g,a] of groups)body+=sec(g==='__over'?'Просрочено':esc(human(g)),`<div class="list">${a.map(x=>taskRow(x,g==='__over')).join('')}</div>`,g==='__over'?'danger':'',a.length);
  }else if(S.tf==='nodate'){
    const a=sortTasks(tl.filter(x=>!x.done&&!x.date));

  }else if(S.tf==='all'){

function openEditor(it){
  isNew=!it.id;
  ed=Object.assign({id:uid(),type:'task',title:'',body:'',date:null,time:'',prio:0,done:false,tag:'',color:'cream',pinned:false,created:Date.now()},JSON.parse(JSON.stringify(it)));
  drawSheet();
  sheet.classList.add('open');back.classList.add('open');document.body.style.overflow='hidden';
  if(isNew){const t=sheet.querySelector('.f-title');if(t)try{t.focus({preventScroll:true})}catch(e){t.focus()}}
}
function closeEditor(){sheet.classList.remove('open');back.classList.remove('open');document.body.style.overflow='';ed=null}
function drawSheet(){
  const task=ed.type==='task',t=todayKey();
  const tags=[...new Set(all().map(i=>i.tag).filter(Boolean))].sort();
  const qd=[[t,'Сегодня'],[addDays(t,1),'Завтра'],[addDays(t,7),'Через неделю'],[null,'Без даты']];
  sheet.innerHTML=`<div class="grab"></div>
  <div class="shead"><button class="x" data-e="close">Отмена</button><button class="save" data-e="save">${isNew?'Добавить':'Сохранить'}</button></div>
  ${isNew?`<div class="seg" style="margin-bottom:10px"><button class="${task?'on':''}" data-e="type" data-v="task">Задача</button><button class="${!task?'on':''}" data-e="type" data-v="note">Заметка</button></div>`:''}
  <input class="f-title" data-f="title" placeholder="${task?'Что нужно сделать?':'Заголовок'}" value="${esc(ed.title)}" enterkeyhint="next">
  <textarea class="f-body ${task?'short':''}" data-f="body" placeholder="${task?'Подробности (необязательно)':'Пиши всё, что в голове…'}" style="${!task?'min-height:180px':''}">${esc(ed.body)}</textarea>
  <div class="fl">Дата${task?' и время':''}</div>
  <div class="row"><label class="inp">${I.cal}<input type="date" data-f="date" value="${ed.date||''}"></label>
  ${task?`<label class="inp" style="flex:.7">${I.clock}<input type="time" data-f="time" value="${ed.time||''}">${ed.time?`<button class="clr" data-e="cleartime" aria-label="Убрать время">×</button>`:''}</label>`:''}</div>
  <div class="quickdates">${qd.map(([k,l])=>`<button class="qd ${ed.date===k?'on':''}" data-e="qd" data-v="${k||''}">${l}</button>`).join('')}</div>
  ${task?`<div class="fl">Приоритет</div><div class="seg" style="margin:0">${PRIO.map((p,i)=>`<button class="${(ed.prio||0)===i?'on':''}" data-e="prio" data-v="${i}">${p}</button>`).join('')}</div>`
        :`<div class="fl">Цвет</div><div class="swatches">${NOTE_COLORS.map(c=>`<button class="sw c-${c} ${ed.color===c?'on':''}" data-e="color" data-v="${c}" aria-label="${c}"></button>`).join('')}</div>`}
  <div class="fl">Тег</div>
  <label class="inp">${I.tag}<input data-f="tag" list="tagl" placeholder="например: работа, книги, дом" value="${esc(ed.tag)}" autocomplete="off"></label>
  <datalist id="tagl">${tags.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  ${tags.length?`<div class="quickdates">${tags.slice(0,8).map(x=>`<button class="qd ${ed.tag===x?'on':''}" data-e="settag" data-v="${esc(x)}">#${esc(x)}</button>`).join('')}</div>`:''}
  ${!task?`<div class="toggle" data-e="pin">Закрепить наверху<span class="sw-t ${ed.pinned?'on':''}"></span></div>`:''}
  ${task&&!isNew?`<div class="toggle" data-e="done">Выполнено<span class="sw-t ${ed.done?'on':''}"></span></div>`:''}
  ${!isNew?`<button class="del" data-e="del">Удалить</button>`:''}`;
  autoGrow(sheet.querySelector('.f-body'));
}
function autoGrow(t){if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,window.innerHeight*.45)+'px'}
sheet.addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f||!ed)return;
  let v=e.target.value;
  if(f==='tag')v=v.replace(/^#/,'').trim().toLowerCase();
  if(f==='date'){ed.date=v||null;sheet.querySelectorAll('.qd[data-e="qd"]').forEach(b=>b.classList.toggle('on',(b.dataset.v||null)===ed.date));return}
  ed[f]=v;
  if(f==='body')autoGrow(e.target);
});
sheet.addEventListener('keydown',e=>{if(e.target.classList.contains('f-title')&&e.key==='Enter'){e.preventDefault();sheet.querySelector('.f-body').focus()}});
sheet.addEventListener('change',e=>{
  if(!e.target.hasAttribute('data-s-file'))return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  f.text().then(importText).catch(()=>toast('Не получилось прочитать файл'));
  e.target.value='';
});
function lastBackupText(){let t=0;try{t=+localStorage.getItem('planner_backup_at')||0}catch(e){}
  if(!t)return 'Копию ещё не сохраняли';const d=new Date(t);return `Последняя копия: ${d.getDate()} ${MON_G[d.getMonth()]}`}
async function exportBackup(){
  const data=JSON.stringify({app:'planner',v:1,exported:new Date().toISOString(),settings:SET,items:all()},null,1);
  const name=`planner-${todayKey()}.json`;
  const blob=new Blob([data],{type:'application/json'});
  let ok=false;
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Копия планера'});ok=true}}
  catch(e){if(e&&e.name==='AbortError')return}
  if(!ok){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);ok=true}
  try{localStorage.setItem('planner_backup_at',String(Date.now()))}catch(e){}
  toast('Копия сохранена');drawSettings();
}
function importText(txt){
  let d;try{d=JSON.parse(String(txt||'').trim())}catch(e){toast('Не похоже на копию планера');return}
  const list=Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:null);
  if(!list){toast('Не похоже на копию планера');return}
  let n=0;
  list.forEach(i=>{if(i&&i.id&&(i.type==='task'||i.type==='note')){const cur=items.get(i.id);if(!cur||(i.updated||0)>=(cur.updated||0)){items.set(i.id,i);n++}}});
  saveLocal();render();closeEditor();
  toast(n?`Перенесено записей: ${n}`:'Новых записей не нашлось');
}
function openSettings(){
  ed=null;drawSettings();
  sheet.classList.add('open');back.classList.add('open');document.body.style.overflow='hidden';
}
function drawSettings(){
  const opt=(k,v,label,pv)=>`<button class="opt ${SET[k]===v?'on':''}" data-s="${k}" data-v="${v}"><span class="pv">${pv}</span>${label}</button>`;
  sheet.innerHTML=`<div class="grab"></div>
  <div class="shead"><div class="stitle">Оформление</div><button class="save" data-s="close">Готово</button></div>
  <div class="fl">Цветовая тема</div>
  <div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${SET.theme===k?'on':''}" data-s="theme" data-v="${k}"><span class="s3"><i style="background:${t.l[0]}"></i><i style="background:${t.l[1]}"></i><i style="background:${t.d[0]}"></i></span>${t.n}</button>`).join('')}</div>
  <div class="fl">Режим</div>
  <div class="opts">${opt('mode','auto','Как в телефоне',I.phone)}${opt('mode','light','Светлый','☀︎')}${opt('mode','dark','Тёмный','☾')}</div>
  <div class="fl">Шрифт</div>
  <div class="opts two">${opt('font','serif','Классика','<span style="font-family:Playfair Display,serif;font-weight:700">Аа</span>')}${opt('font','hand','От руки','<span style="font-family:Caveat,cursive;font-weight:700;font-size:34px">Аа</span>')}${opt('font','sans','Современный','<span style="font-family:Manrope;font-weight:800">Аа</span>')}${opt('font','soft','Мягкий','<span style="font-family:Comfortaa;font-weight:700">Аа</span>')}</div>
  <div class="fl">Календарь</div>
  <div class="opts two">${opt('calView','grid','Месяц сеткой',I.grid)}${opt('calView','stickers','Стикеры на неделю',I.sticky)}</div>
  <div class="fl">Заметки</div>
  <div class="opts">${opt('notesView','cards','Карточки',I.grid)}${opt('notesView','stickers','Стикеры',I.sticky)}${opt('notesView','list','Список',I.rows)}</div>
  <div class="fl">Резервная копия</div>
  <div class="bk">Записи хранятся только на этом телефоне. Сохраняй копию иногда — например, раз в неделю.<br><span>${lastBackupText()}</span></div>
  <div class="opts two"><button class="opt" data-s="export"><span class="pv">${I.down}</span>Сохранить копию</button>
  <label class="opt"><span class="pv">${I.up}</span>Восстановить из файла<input type="file" accept=".json,application/json,text/plain" data-s-file hidden></label></div>
  <button class="opt" data-s="pastebox" style="width:100%;margin-top:10px;flex-direction:row;justify-content:center">${I.note} Перенести записи из онлайн-версии</button>
  <div id="pastewrap" style="display:none;margin-top:10px">
    <textarea class="f-body" id="pastearea" placeholder="Вставь сюда текст, скопированный кнопкой «Скопировать все записи» в онлайн-версии" style="min-height:100px"></textarea>
    <button class="save" data-s="pastego" style="margin-top:10px;width:100%;padding:13px">Перенести</button>
  </div>
  <div style="height:8px"></div>`;
}
sheet.addEventListener('click',e=>{
  const s=e.target.closest('[data-s]');
  if(s){
    const k=s.dataset.s;
    if(k==='close'){closeEditor();return}
    if(k==='export'){exportBackup();return}
    if(k==='pastebox'){const w=document.getElementById('pastewrap');w.style.display=w.style.display==='none'?'block':'none';return}
    if(k==='pastego'){importText(document.getElementById('pastearea').value);return}
    SET[k]=s.dataset.v;SET.ts=Date.now();applyTheme();saveSettings();render();drawSettings();return;
  }
  const b=e.target.closest('[data-e]');if(!b||!ed)return;
  const a=b.dataset.e,v=b.dataset.v;
  if(a==='close')closeEditor();
  else if(a==='save'){
    if(!ed.title.trim()&&!ed.body.trim()){const t=sheet.querySelector('.f-title');t.focus();t.placeholder=ed.type==='task'?'Напиши, что сделать':'Добавь заголовок или текст';return}
    if(!ed.title.trim()){const lines=ed.body.split('\n');const i=lines.findIndex(x=>x.trim());ed.title=lines[i].trim();lines.splice(i,1);ed.body=lines.join('\n').trim()}
    const it={...ed,title:ed.title.trim(),tag:(ed.tag||'').replace(/^#/,'').trim().toLowerCase()};
    if(it.type==='note'){delete it.prio;delete it.done;delete it.time}else{delete it.color;delete it.pinned}
    put(it);closeEditor();
    if(isNew&&it.date&&(S.view==='today'||S.view==='calendar'))S.sel=it.date,render();
  }
  else if(a==='type'){ed.type=v;if(v==='note'&&S.view==='notes')ed.date=null;drawSheet()}
  else if(a==='qd'){ed.date=v||null;drawSheet()}
  else if(a==='cleartime'){e.preventDefault();ed.time='';drawSheet()}
  else if(a==='prio'){ed.prio=+v;drawSheet()}
  else if(a==='color'){ed.color=v;drawSheet()}
  else if(a==='settag'){ed.tag=ed.tag===v?'':v;drawSheet()}
  else if(a==='pin'){ed.pinned=!ed.pinned;drawSheet()}
  else if(a==='done'){ed.done=!ed.done;drawSheet()}
  else if(a==='del'){const old=items.get(ed.id);closeEditor();if(old){remove(old.id);toast(old.type==='task'?'Задача удалена':'Заметка удалена',()=>put(old))}}
});
back.addEventListener('click',closeEditor);

/* ---------- toast ---------- */
let tt=null,undoFn=null;
const toastEl=document.getElementById('toast');
function toast(msg,undo){
  document.getElementById('toastMsg').textContent=msg;
  undoFn=undo||null;document.getElementById('toastBtn').style.display=undo?'':'none';
  toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),4500);
}
document.getElementById('toastBtn').addEventListener('click',()=>{if(undoFn)undoFn();undoFn=null;toastEl.classList.remove('show')});

/* ---------- start ---------- */
loadLocal();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
// refresh "today" when the day changes while the app stays open
let lastDay=todayKey();
setInterval(()=>{const t=todayKey();if(t!==lastDay){if(S.sel===lastDay)S.sel=t;lastDay=t;render()}},60000);
</script>
</body>
</html>
