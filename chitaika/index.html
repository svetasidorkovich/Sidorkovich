<style>

@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,#4F86F7 0%,#7FB2FF 60%,#A9DAFF 100%) #4F86F7}
body{background:transparent!important}
body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
button,.cell,.tile,.opt,.isle{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app,.card{-webkit-user-select:none;user-select:none}
.parents{-webkit-user-select:text;user-select:text}

/* Layout: a 30-day adventure map through five bright worlds; hero Ням the word-eater lives on top; each day = 6 mini-games ≈ 15 min. Single bright look on purpose. */
:root{
  --ink:#1F2A5C; --muted:#5A6499; --coral:#FF5A5F; --sun:#FFC530; --grass:#2FD07A; --grape:#8B5CFF; --sea:#12C6E0; --pink:#FF5FB0; --orange:#FF8A3D;
  --card:#FFFFFF; --soft:#F0F4FF; --line:#DCE3FB;
  --display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.novoice .say{display:none}
html,body{min-height:100%}
body{background:#45B4FF;color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 40px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;transition:background .8s;background:linear-gradient(180deg,#45B4FF 0%,#8FDCFF 55%,#7EE08F 100%)}
body.w2 .sky{background:linear-gradient(180deg,#14A8E0 0%,#6FE0F0 55%,#FFE09A 100%)}
body.w3 .sky{background:linear-gradient(180deg,#FF6FB8 0%,#FFB3DA 55%,#FFE3A0 100%)}
body.w4 .sky{background:radial-gradient(circle at 20% 15%,#7B4DFF 0,transparent 40%),linear-gradient(180deg,#1E1260 0%,#4A2399 60%,#8E3FD6 100%)}
body.w5 .sky{background:linear-gradient(180deg,#FFA62B 0%,#FFD45E 55%,#FFF0B0 100%)}
.deco span{position:absolute;font-size:34px;opacity:.6;animation:floaty 8s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-26px) rotate(12deg)}}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* bar */
.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:30px;color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 rgba(31,42,92,.28);margin-right:auto}
.logo b{color:var(--sun)}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 12px 6px 8px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(31,42,92,.18);font-variant-numeric:tabular-nums}
.chip i{font-style:normal;font-size:19px}
.chip.bump{animation:win .5s}
.iconbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);font-size:19px;box-shadow:0 3px 0 rgba(31,42,92,.18);display:grid;place-items:center;font-weight:900;flex:none}
.iconbtn.off{opacity:.55}

/* hero */
.hero-w{position:relative;flex:none}
.hero-w svg{width:100%;height:100%;overflow:visible;display:block;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04,.96)}}
.hero-w .f1{fill:var(--h1,#4FB3FF)} .hero-w .f2{fill:var(--h2,#2C86E8)}
.hero-w .horn{fill:#FFD66B}.hero-w .belly{fill:#fff;opacity:.38}
.hero-w .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hero-w .m,.hero-w .eyes-happy{display:none}
.hero-w .m-smile{display:inline}
.hero-w.eat .m-smile,.hero-w.happy .m-smile,.hero-w.sad .m-smile{display:none}
.hero-w.eat .m-open,.hero-w.happy .m-open{display:inline}
.hero-w.happy .eyes{display:none}.hero-w.happy .eyes-happy{display:inline}
.hero-w.sad .m-sad{display:inline}
.hero-w.eat svg{animation:chomp .45s ease}
.hero-w.happy svg{animation:jump .6s ease}
.hero-w.sad svg{animation:shake .45s}
@keyframes chomp{30%{transform:scale(1.18,.85)}60%{transform:scale(.92,1.08)}}
@keyframes jump{40%{transform:translateY(-22%) rotate(-6deg)}}
.hero-w.rainbow svg{animation:breathe 2.6s ease-in-out infinite,hue 4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.h-hat,.h-gl{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.h-hat{top:-.2em;font-size:.42em}
.h-gl{top:.3em;font-size:.44em}
.h-acc{position:absolute;left:-.16em;bottom:.14em;font-size:.34em;line-height:1;pointer-events:none;transform:rotate(-12deg)}
.h-pet{position:absolute;right:-.4em;bottom:-.02em;font-size:.36em;line-height:1;pointer-events:none;animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-30%)}}
.hero-w.golden svg{animation:breathe 2.6s ease-in-out infinite,shine 2.2s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25) saturate(1.2) drop-shadow(0 0 6px #FFE27A)}}
.hero-w.hungry .m-smile{display:none}.hero-w.hungry .m-sad{display:inline}
#homeHero{padding:0 44px 0 26px}#gHero{padding-right:18px;padding-left:10px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.house{width:100%;min-height:118px;border-radius:24px;border:4px solid #fff;box-shadow:0 5px 0 rgba(31,42,92,.15);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;cursor:pointer}
.house-h{align-self:flex-start;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-weight:900;font-size:15px}
.house-items{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end;justify-content:center;font-size:38px;line-height:1.1;margin-top:auto}
.house-items span{animation:floaty 5s ease-in-out infinite;display:inline-block}
.house-empty{margin-top:auto;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;font-weight:800;color:var(--muted);font-size:15px}
#shopHero{border-radius:22px;padding:10px 54px 8px 30px;transition:background .3s}
.status .chip{font-size:15px}
.belly-m{letter-spacing:1px}
.flyw{position:fixed;z-index:65;font-weight:900;font-size:28px;color:var(--ink);background:#fff;border-radius:12px;padding:2px 10px;pointer-events:none;box-shadow:0 4px 0 rgba(31,42,92,.15)}

/* home */
.stage{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:13px 15px;font-weight:800;font-size:17px;line-height:1.35;box-shadow:0 5px 0 rgba(31,42,92,.15);flex:1;min-width:0;margin-bottom:24px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.bubble b{color:var(--coral)}
.todaybox{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 rgba(31,42,92,.15)}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.todaybox .tx{flex:1;min-width:0;font-weight:800;line-height:1.3}
.todaybox .tx small{display:block;color:var(--muted);font-weight:700}
.play{width:100%;border-radius:26px;padding:18px 16px;font-family:var(--display);font-weight:700;font-size:26px;color:#fff;
  background:linear-gradient(180deg,#FF8A3D,#FF4F8B);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 7px 0 rgba(31,42,92,.22);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:wiggle 2.8s ease-in-out infinite}
.play small{display:block;font-family:var(--body);font-weight:800;font-size:15px;opacity:.95}
@keyframes wiggle{0%,80%,100%{transform:none}85%{transform:rotate(-2deg) scale(1.03)}90%{transform:rotate(2deg) scale(1.03)}95%{transform:rotate(-1deg)}}
.play:active{transform:translateY(4px)}

/* map */
.world{position:relative;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.55);border-radius:30px;padding:14px 10px 18px;display:flex;flex-direction:column;gap:2px}
.world h3{margin:0 0 6px;font-family:var(--display);color:#fff;text-shadow:0 2px 0 rgba(31,42,92,.3);font-size:22px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:124px}
.nw.p0{align-self:flex-start;margin-left:6%}.nw.p1{align-self:center}.nw.p2{align-self:flex-end;margin-right:6%}
.steps{display:flex;gap:9px;justify-content:center;opacity:.85}
.steps span{width:9px;height:9px;border-radius:50%;background:#fff}
.node{position:relative;width:76px;height:76px;border-radius:50%;background:#fff;color:var(--ink);font-weight:900;font-size:28px;display:grid;place-items:center;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.12),0 6px 0 rgba(31,42,92,.22);transition:transform .15s}
.node:active{transform:scale(.93)}
.node.done{background:linear-gradient(180deg,#FFE066,#FFB21E);color:#7A4A00}
.node.cur{background:linear-gradient(180deg,#FF8A3D,#FF4F8B);color:#fff;animation:pulse 1.5s ease-in-out infinite}
.node.lock{background:rgba(255,255,255,.6);color:#97A0C4;font-size:24px}
.node.boss{width:88px;height:88px;font-size:38px}
.node.boss:not(.lock){background:linear-gradient(180deg,#8E6BFF,#5131D6);color:#fff}
.node.boss.done{background:linear-gradient(180deg,#FFE066,#FFB21E)}
@keyframes pulse{50%{transform:scale(1.08)}}
.nlbl{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.95);border-radius:10px;padding:3px 8px;text-align:center;line-height:1.2;box-shadow:0 2px 0 rgba(31,42,92,.12)}
.nst{font-size:14px;letter-spacing:1px;min-height:18px}
.dim{opacity:.28;filter:grayscale(1)}
.mini{position:absolute;right:-50px;top:4px}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* day screen */
.gtop{display:flex;align-items:center;gap:8px}
.gtitle{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(31,42,92,.3);flex:1;min-width:0;line-height:1.15}
.gtitle small{display:block;font-family:var(--body);font-size:14px;font-weight:800;opacity:.95}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ad{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.4);display:grid;place-items:center;font-size:17px;transition:all .3s}
.ad.done{background:var(--sun)}
.ad.now{background:#fff;transform:scale(1.15);box-shadow:0 3px 0 rgba(31,42,92,.2)}
.row2{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:30px}
.rdots{display:flex;gap:5px;flex-wrap:wrap}
.rdots span{width:20px;height:9px;border-radius:5px;background:rgba(255,255,255,.45)}
.rdots span.done{background:var(--sun)}.rdots span.now{background:#fff}
.combo{font-weight:900;font-size:15px;color:#fff;background:var(--coral);border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 rgba(31,42,92,.15);white-space:nowrap}
.combo.hot{animation:win .5s}
.card{background:var(--card);border-radius:28px;padding:20px 16px 22px;box-shadow:0 8px 0 rgba(31,42,92,.2);display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;min-width:0}
.qa{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.ask{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--muted);text-align:center;text-wrap:balance}
.say{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:18px;display:grid;place-items:center}
.tbar{position:absolute;top:-20px;left:8px;right:8px;height:6px;border-radius:0 0 6px 6px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.pic{font-size:90px;line-height:1.1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sentence{font-weight:900;font-size:29px;line-height:1.3;text-align:center;text-wrap:balance}
.rv-word{font-weight:900;font-size:54px;letter-spacing:4px;text-align:center;overflow-wrap:anywhere;max-width:100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.rv-pic{font-size:96px;line-height:1.1;min-height:106px;display:grid;place-items:center}
.rv-pic.hid{color:var(--line);font-family:var(--display);font-weight:700}
.story{font-weight:800;font-size:22px;line-height:1.5;background:#FFF8E1;border-radius:20px;padding:14px 16px;width:100%}
.storyq{font-weight:900;font-size:23px;text-align:center;color:var(--grape)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:72px;border-radius:20px;background:var(--soft);font-weight:900;font-size:34px;letter-spacing:2px;color:var(--ink);
  box-shadow:inset 0 -6px 0 var(--line);transition:transform .1s;animation:pop .4s backwards;padding:6px 10px;overflow-wrap:anywhere}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--grass);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);animation:win .5s}
.opt.bad{background:#FFE2DF;color:#E2928A;box-shadow:none;animation:shake .4s}
.opt.emo{font-size:54px}
.opt.yes{background:var(--grass);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.opt.no{background:var(--coral);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.opt.yes.bad,.opt.no.bad{opacity:.4}
@keyframes win{40%{transform:scale(1.12) rotate(-3deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.glue{display:flex;align-items:center;gap:10px;font-weight:900;font-size:42px;flex-wrap:wrap;justify-content:center}
.glue .c1{background:var(--coral);color:#fff;border-radius:16px;padding:4px 16px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.glue .c2{background:#3D74F0;color:#fff;border-radius:16px;padding:4px 16px;letter-spacing:2px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.glue .op{color:var(--muted);font-size:34px}
.q{border:3px dashed var(--grape);color:var(--grape);border-radius:16px;padding:0 18px;min-width:70px;text-align:center}
.q.filled{border-style:solid;background:var(--grass);border-color:var(--grass);color:#fff;animation:pop .35s}

.ladder{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.lstep{font-weight:900;font-size:38px;letter-spacing:3px;border-radius:18px;padding:8px 22px;background:var(--soft);box-shadow:inset 0 -6px 0 var(--line);animation:pop .4s;min-width:120px;color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.lstep .n{color:var(--coral)}
.lstep.read{background:#E2F8EC;box-shadow:inset 0 -6px 0 #BCEBD2}
.lstep.cur{outline:4px solid var(--sun);animation:pop .4s,nudge 1.4s 1s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.05)}}
.lhint{font-weight:800;color:var(--muted);text-align:center;font-size:15px;max-width:34ch}
.arrow{color:var(--line);font-size:20px;line-height:.6}

.flash{font-weight:900;font-size:50px;letter-spacing:3px;min-height:80px;display:grid;place-items:center;text-align:center;width:100%}
.flash .hid{color:var(--line)}
.speed{font-weight:900;color:var(--grape);background:#F1EAFF;border-radius:999px;padding:4px 12px;font-size:15px}
.again{font-weight:800;color:#3D74F0;background:var(--soft);border-radius:999px;padding:8px 14px}

.tgrid{display:grid;gap:6px;width:100%}

/* ---------- лесенка ---------- */
function ladderSteps(w){
  const hasCC=x=>runs(x).length>0;
  if(!hasCC(w))return[{t:w}];
  const st=[];let p;
  const vi=[];for(let k=0;k<w.length;k++)if(isV(w[k]))vi.push(k);
  if(isC(w[0])&&isC(w[1])){ // трудное в начале: ЛО → БЛО
    const j=vi[0];for(let k=j-1;k>=0;k--)st.push({t:w.slice(k,j+1),n:k<j-1?1:0});p=j+1}
  else{p=(vi[0]??w.length-1)+1;st.push({t:w.slice(0,p)})}
  const push=end=>{const prev=st[st.length-1].t.length;st.push({t:w.slice(0,end),n:end-prev,tail:1})};
  while(p<w.length){
    if(!hasCC(w.slice(p))&&!(isC(w[p])&&isC(w[p+1]))){push(w.length);break}
    const nv=vi.find(v=>v>=p);
    if(nv===undefined){ // согласные в конце: добавляем по одной
      for(let k=p+1;k<=w.length;k++){if(w[k]==='Ь'||w[k]==='Ъ')continue;push(k)}break}
    const cons=w.slice(p,nv).replace(/[ЬЪ]/g,'');
    if(cons.length>=2){let e=p+1;if(w[e]==='Ь'||w[e]==='Ъ')e++;push(e);push(nv+1)} // КА → КАР → КАРТО
    else push(nv+1);
    p=nv+1}
  const out=st.filter((x,k,a)=>!k||x.t!==a[k-1].t);out[0]={t:out[0].t};return out}

const ONSETS=['БЛ','ПЛ','КЛ','ГЛ','ФЛ','СЛ','БР','ПР','КР','ГР','ДР','ТР','ВР','СТ','СК','СП','СН','СМ','СВ','ЗВ','ЗМ','ШК','ШЛ','ГН','КН','ДВ','ПТ','ПЧ','ЛК','НТ','РТ','СТР','СКР','СПР','НГВ'];
const GOODON=new Set(['БЛ','ПЛ','КЛ','ГЛ','ФЛ','СЛ','БР','ПР','КР','ГР','ДР','ТР','ВР','СТ','СК','СП','СН','СМ','СВ','ЗВ','ЗМ','ШК','ШЛ','ГН','КН','ДВ','ПТ','ПЧ','ТВ','ЗД','ЧК','СТР','СКР','СПР']);
function sylls(w){const vi=[];[...w].forEach((c,k)=>{if(isV(c))vi.push(k)});if(vi.length<2)return[w];const out=[];let start=0;
  for(let n=0;n<vi.length-1;n++){const a=vi[n],b=vi[n+1],cons=w.slice(a+1,b),cl=cons.replace(/[ЬЪ]/g,'');let cut;
    if(cl.length<=1||GOODON.has(cl))cut=a+1;else{cut=a+2;if(w[cut]==='Ь'||w[cut]==='Ъ')cut++}
    out.push(w.slice(start,cut));start=cut}
  out.push(w.slice(start));return out}

RUN.fall=()=>{const targets=shuffle(G.pool.filter(([,w])=>w.length<=8)).slice(0,3),NEED=4;seen(targets);let wave=0;
  const run=()=>{const [e,w]=targets[wave];let got=0;const bad=shuffle(WORDS.filter(x=>x[1]!==w&&x[0]!==e&&x[1].length<=8)).slice(0,6).map(x=>x[1]);rdots(wave,targets.length);

    const area=$('#area'),list=[];let last=performance.now(),rq=0,alive=true,si=0;G.fall={w};
    const spawn=()=>{if(!alive||list.length>=5)return;const ok=!list.some(o=>o.ok&&!o.el.dataset.done)||Math.random()<.4,txt=ok?w:pick(bad);
      const el=document.createElement('button');el.className='star';el.innerHTML=`<span>⭐</span><b>${F(txt)}</b>`;el.dataset.ok=ok?1:0;area.appendChild(el);
      const o={el,ok,x:Math.random()*Math.max(0,area.clientWidth-el.offsetWidth),y:-56,v:24+Math.random()*12+wave*3,r:Math.random()*16-8};list.push(o);
      el.onclick=()=>{if(el.dataset.done||got>=NEED)return;
        if(o.ok){el.dataset.done=1;el.classList.add('caughtS');sfx.pop();got++;$('#got').textContent=`Поймано: ${got} из ${NEED}`;G.combo++;S.coins++;G.coins++;save();feed(el,w);updCombo();
          setTimeout(()=>{el.remove();const k=list.indexOf(o);if(k>=0)list.splice(k,1)},350);
          if(got>=NEED){alive=false;clearInterval(si);toast(pick(PRAISE));say(w);later(()=>{wave++;if(wave<targets.length)run();else actEnd()},1300)}}
        else{el.classList.remove('wr');void el.offsetWidth;el.classList.add('wr');wrong()}};
      el.style.transform=`translate(${o.x}px,${o.y}px)`};
    const tick=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;

  run()};

      if(S.coins<it.p)return noMoney(it,'Чтобы купить');
      ask(`Покормить Няма: ${it.e} ${it.n} за <b>${it.p} 🪙</b>?<small>Останется ${S.coins-it.p} 🪙</small>`,'Покормить',()=>{
        S.coins-=it.p;S.full=Math.min(FULLMAX,S.full+it.f);S.fullDay=S.fullDay||todayStr();save();updCoins();sfx.coin();
        const h=$('#shopHero .hero-w'),r=h.getBoundingClientRect(),fl=document.createElement('div');fl.className='fly';fl.style.fontSize='46px';fl.textContent=it.e;
        fl.style.left=(innerWidth/2-23)+'px';fl.style.top=(innerHeight-200)+'px';document.body.appendChild(fl);
        fl.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${r.left+r.width/2-innerWidth/2}px,${r.top+r.height*.62-(innerHeight-200)}px) scale(.3)`}],{duration:650,easing:'ease-in'}).onfinish=()=>{fl.remove();
          heroDo(h,'eat',600);sfx.chomp();setTimeout(()=>{heroDo(h,'happy',1000);confetti(40);say(pick(['Ням-ням! Спасибо!','Вкуснятина!','Ммм, как вкусно!']))},600);
          setTimeout(()=>openShop('f'),1700)}});
      return}
    const key=tab+':'+it.id;
    if(C.room&&S.own.includes(key)){sfx.tap();$('#shopMsg').textContent=`«${it.n}» уже стоит в домике Няма 🏠`;return}
    if(S.own.includes(key)){sfx.tap();S[C.k]=it.id;save();openShop(tab);heroDo($('#shopHero .hero-w'),'happy',900);return}
    if(tab==='b')$('#shopHero').style.background=it.bg;else if(!C.room)paintHeroes({[tab]:it.id});heroDo($('#shopHero .hero-w'),'happy',700);sfx.tap();
    if(it.gift){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent=`Это особый подарок 🎁 Его нельзя купить. Он придёт сам, когда пройдёшь день ${it.gift}!`;return}
    if(locked(it)){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent=`Это примерка 👀 «${it.n}» откроется после дня ${it.d}.`;return}
    if(S.coins<it.p)return noMoney(it,'Это примерка 👀 Чтобы купить');
    $('#shopMsg').textContent='Это примерка 👀';
    ask(`Купить «${it.n}» за <b>${it.p} 🪙</b>?<small>После покупки останется ${S.coins-it.p} 🪙</small>`,'Купить',()=>{S.coins-=it.p;S.own.push(key);if(C.k)S[C.k]=it.id;save();updCoins();sfx.coin();confetti(60);say('Ура! Спасибо!');openShop(tab);heroDo($('#shopHero .hero-w'),'happy',900)})});
  $('#shopClose').onclick=()=>{hideOv();if(!G)renderHome();else paintHeroes()};
}
let resetArm=false;
function openInfo(){
  const wk=[['Неделя 1','БЛ, ПЛ, КЛ, ГЛ, ФЛ, СЛ, потом БР, ПР, КР, ГР. В конце битва с Кляксой.'],['Неделя 2','ДР, ТР, ВР, «Л или Р?», СТ, СК, СП, СН, СМ, СВ. Битва.'],
    ['Неделя 3','ЗВ, ЗМ, ШЛ, ГН, КН, ДВ, ШК, ЧК. Стечения в середине и в конце слова. Битва.'],['Неделя 4','Три согласных (СТР, СКР, СПР), длинные слова, фразы, истории, скорость. Битва.'],['Дни 29–30','Повторение и праздничный финал с короной.']];
  showOv(`<h2>Для родителей</h2><div class="info">
    <p>Тренажёр рассчитан на <b>30 дней по ~15 минут</b>. Каждый день состоит из 5–6 мини-игр и идёт от простого к сложному.</p>
    <div class="weeks">${wk.map(([a,b])=>`<div><b>${a}.</b> ${b}</div>`).join('')}</div>
    <h3>Как читать БЛ, КР, СТ</h3>
    <p>Ребёнок спотыкается, потому что читает согласные по отдельности и вставляет лишнюю гласную: «БО-ЛОК». Помогает такой приём: найти гласную, согласную перед ней читать вместе с ней (<span class="ex">ЛО</span>), а первую согласную тянуть и «приклеить» (<span class="ex">ббб…ЛО → БЛО → БЛОК</span>). Этому учит «Лесенка».</p>
    <h3>Таблица на скорость</h3>
    <p>Эту игру лучше проходить вместе. Ребёнок читает вслух, а вы слушаете, нет ли лишних гласных. Игра ребёнка не слышит.</p>
    <h3>Озвучка</h3>
    <label class="toggle"><input type="checkbox" id="voiceT" ${S.voiceOn?'checked':''}> Читать вслух задания и слова</label>
    <div id="voiceBox" ${S.voiceOn?'':'hidden'} style="display:flex;flex-direction:column;gap:8px">
      ${ruVoices.length?`<select id="voiceSel" style="font:inherit;font-weight:800;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)">${ruVoices.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${ruVoice&&v.name===ruVoice.name?'selected':''}>${v.name}</option>`).join('')}</select>
      <button class="bigbtn alt" id="voiceTry">▶ Послушать голос</button>
      <p style="color:var(--muted);font-size:14px">Голоса берутся из телефона. Лучше всего звучат голоса с пометкой «улучшенный», Enhanced, Premium или Natural. Их можно скачать в настройках телефона: «Универсальный доступ → Устный контент» на iPhone, «Синтез речи» на Android.</p>`
      :'<p style="color:var(--muted)">На этом устройстве не найден русский голос.</p>'}
    </div>
    <h3>Буквы</h3>
    <label class="toggle"><input type="checkbox" id="lowerT" ${S.lower?'checked':''}> Писать слова маленькими буквами, как в книгах</label>
    <label class="toggle"><input type="checkbox" id="dailyT" ${S.daily?'checked':''}> Открывать не больше одного нового дня в сутки</label>
    <button class="bigbtn alt" id="resetB">Сбросить весь прогресс</button></div>
    <div class="btns"><button class="bigbtn" id="infoClose">Закрыть</button></div>`);
  $('#dailyT').onchange=e=>{S.daily=e.target.checked;save()};
  $('#lowerT').onchange=e=>{S.lower=e.target.checked;save()};
  $('#voiceT').onchange=e=>{S.voiceOn=e.target.checked;save();$('#voiceBox').hidden=!S.voiceOn;document.body.classList.toggle('novoice',!S.voiceOn);if(S.voiceOn)say('Привет! Я Ням. Давай читать!')};
  if($('#voiceSel'))$('#voiceSel').onchange=e=>{S.voiceName=e.target.value;save();loadVoice();say('Привет! Я Ням. Давай читать!',1)};
  if($('#voiceTry'))$('#voiceTry').onclick=()=>say('Привет! Я Ням. Давай читать!',1);
  $('#resetB').onclick=e=>{if(!resetArm){resetArm=true;e.target.textContent='Точно? Нажмите ещё раз';e.target.style.background='#FFD9D6';setTimeout(()=>{resetArm=false},3000);return}
    const keep={sound:S.sound,music:S.music,lower:S.lower,voiceOn:S.voiceOn,voiceName:S.voiceName};S={days:{},coins:0,flashT:2500,speedV2:1,seed1:1,voice2:1,full:3,fullDay:todayStr(),acc:'',pet:'',seed2:1,rec:{},own:['s:blue','h:','g:','a:','p:','b:'],skin:'blue',hat:'',gl:'',bg:'',prog:null,daily:S.daily,time:{d:'',ms:0},tip:0,...keep};save();resetArm=false;hideOv();renderHome()};
  $('#infoClose').onclick=()=>{hideOv();renderHome()};
}
$('#shopBtn').onclick=()=>{sfx.tap();openShop()};
$('#infoBtn').onclick=()=>{sfx.tap();openInfo()};
function syncBtns(){$('#sndBtn').textContent=S.sound?'🔊':'🔇';$('#musBtn').classList.toggle('off',!S.music);$('#musBtn').setAttribute('aria-label',S.music?'Выключить музыку':'Включить музыку');}
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();syncBtns();sfx.tap()};
$('#musBtn').onclick=()=>{S.music=!S.music;save();syncBtns();if(S.music)Music.play(musicWanted);else Music.stop()};

document.addEventListener('visibilitychange',()=>{if(document.hidden)Music.stop();else if(S.music&&AC)Music.play(musicWanted)});
setInterval(()=>{if(G&&!document.hidden&&!$('#dayScreen').hidden){todayMs();S.time.ms+=1000;if(S.time.ms%10000===0)save()}},1000);
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
window.__chit={get G(){return G},S:()=>S,DAYS,dayPool,ladderSteps,wrongs};
syncBtns();renderHome();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
