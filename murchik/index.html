<style>

@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(180deg,#7A5CFF 0%,#7FB2FF 60%,#A9DAFF 100%) #7A5CFF}
body{background:transparent!important}
body{margin:0;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%}
button,.cell,.tile,.opt,.isle{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app,.card{-webkit-user-select:none;user-select:none}
.parents{-webkit-user-select:text;user-select:text}

/* Layout: a 30-day speed-reading map through five bright worlds; hero Мурчик the rainbow kitten lives on top; each day = 4–6 drills ≈ 15 min. Single bright look on purpose. */
:root{
  --ink:#1F2A5C; --muted:#5A6499; --coral:#FF5A5F; --sun:#FFC530; --grass:#2FD07A; --grape:#8B5CFF; --sea:#12C6E0; --pink:#FF5FB0; --orange:#FF8A3D;
  --card:#FFFFFF; --soft:#F0F4FF; --line:#DCE3FB;
  --display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.novoice .say{display:none}
html,body{min-height:100%}
body{background:#45B4FF;color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 40px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;transition:background .8s;background:linear-gradient(180deg,#45B4FF 0%,#8FDCFF 55%,#7EE08F 100%)}
body.w2 .sky{background:linear-gradient(180deg,#14A8E0 0%,#6FE0F0 55%,#FFE09A 100%)}
body.w3 .sky{background:linear-gradient(180deg,#FF7A9C 0%,#B06BE0 55%,#5A4FCF 100%)}
body.w4 .sky{background:radial-gradient(circle at 20% 15%,#7B4DFF 0,transparent 40%),linear-gradient(180deg,#1E1260 0%,#4A2399 60%,#8E3FD6 100%)}
body.w5 .sky{background:linear-gradient(180deg,#FFA62B 0%,#FFD45E 55%,#FFF0B0 100%)}
.deco span{position:absolute;font-size:34px;opacity:.6;animation:floaty 8s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-26px) rotate(12deg)}}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* bar */
.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:30px;color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 rgba(31,42,92,.28);margin-right:auto}
.logo b{color:var(--sun)}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border-radius:999px;padding:6px 12px 6px 8px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(31,42,92,.18);font-variant-numeric:tabular-nums}
.chip i{font-style:normal;font-size:19px}
.chip.bump{animation:win .5s}
.iconbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);font-size:19px;box-shadow:0 3px 0 rgba(31,42,92,.18);display:grid;place-items:center;font-weight:900;flex:none}
.iconbtn.off{opacity:.55}

/* hero */
.hero-w{position:relative;flex:none}
.hero-w svg{width:100%;height:100%;overflow:visible;display:block;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04,.96)}}
.hero-w .f1{fill:var(--h1,#4FB3FF)} .hero-w .f2{fill:var(--h2,#2C86E8)}
.hero-w .horn{fill:#FFD66B}.hero-w .belly{fill:#fff;opacity:.38}
.hero-w .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hero-w .m,.hero-w .eyes-happy{display:none}
.hero-w .m-smile{display:inline}
.hero-w.eat .m-smile,.hero-w.happy .m-smile,.hero-w.sad .m-smile{display:none}
.hero-w.eat .m-open,.hero-w.happy .m-open{display:inline}
.hero-w.happy .eyes{display:none}.hero-w.happy .eyes-happy{display:inline}
.hero-w.sad .m-sad{display:inline}
.hero-w.eat svg{animation:chomp .45s ease}
.hero-w.happy svg{animation:jump .6s ease}
.hero-w.sad svg{animation:shake .45s}
@keyframes chomp{30%{transform:scale(1.18,.85)}60%{transform:scale(.92,1.08)}}
@keyframes jump{40%{transform:translateY(-22%) rotate(-6deg)}}
.hero-w.rainbow svg{animation:breathe 2.6s ease-in-out infinite,hue 4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.h-hat,.h-gl{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.h-hat{top:-.2em;font-size:.42em}
.h-gl{top:.3em;font-size:.44em}
.h-acc{position:absolute;left:-.16em;bottom:.14em;font-size:.34em;line-height:1;pointer-events:none;transform:rotate(-12deg)}
.h-pet{position:absolute;right:-.4em;bottom:-.02em;font-size:.36em;line-height:1;pointer-events:none;animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-30%)}}
.hero-w.golden svg{animation:breathe 2.6s ease-in-out infinite,shine 2.2s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25) saturate(1.2) drop-shadow(0 0 6px #FFE27A)}}
.hero-w.hungry .m-smile{display:none}.hero-w.hungry .m-sad{display:inline}
#homeHero{padding:0 44px 0 26px}#gHero{padding-right:18px;padding-left:10px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.house{width:100%;min-height:118px;border-radius:24px;border:4px solid #fff;box-shadow:0 5px 0 rgba(31,42,92,.15);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;cursor:pointer}
.house-h{align-self:flex-start;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-weight:900;font-size:15px}
.house-items{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end;justify-content:center;font-size:38px;line-height:1.1;margin-top:auto}
.house-items span{animation:floaty 5s ease-in-out infinite;display:inline-block}
.house-empty{margin-top:auto;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;font-weight:800;color:var(--muted);font-size:15px}
#shopHero{border-radius:22px;padding:10px 54px 8px 30px;transition:background .3s}
.status .chip{font-size:15px}
.belly-m{letter-spacing:1px}
.flyw{position:fixed;z-index:65;font-weight:900;font-size:28px;color:var(--ink);background:#fff;border-radius:12px;padding:2px 10px;pointer-events:none;box-shadow:0 4px 0 rgba(31,42,92,.15)}

/* home */
.stage{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:13px 15px;font-weight:800;font-size:17px;line-height:1.35;box-shadow:0 5px 0 rgba(31,42,92,.15);flex:1;min-width:0;margin-bottom:24px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.bubble b{color:var(--coral)}
.todaybox{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 rgba(31,42,92,.15)}
.ring{flex:none;width:58px;height:58px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.todaybox .tx{flex:1;min-width:0;font-weight:800;line-height:1.3}
.todaybox .tx small{display:block;color:var(--muted);font-weight:700}
.play{width:100%;border-radius:26px;padding:18px 16px;font-family:var(--display);font-weight:700;font-size:26px;color:#fff;
  background:linear-gradient(180deg,#FF8A3D,#FF4F8B);box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),0 7px 0 rgba(31,42,92,.22);text-shadow:0 2px 0 rgba(0,0,0,.15);animation:wiggle 2.8s ease-in-out infinite}
.play small{display:block;font-family:var(--body);font-weight:800;font-size:15px;opacity:.95}
@keyframes wiggle{0%,80%,100%{transform:none}85%{transform:rotate(-2deg) scale(1.03)}90%{transform:rotate(2deg) scale(1.03)}95%{transform:rotate(-1deg)}}
.play:active{transform:translateY(4px)}

/* map */
.world{position:relative;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.55);border-radius:30px;padding:14px 10px 18px;display:flex;flex-direction:column;gap:2px}
.world h3{margin:0 0 6px;font-family:var(--display);color:#fff;text-shadow:0 2px 0 rgba(31,42,92,.3);font-size:22px;display:flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.nw{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:124px}
.nw.p0{align-self:flex-start;margin-left:6%}.nw.p1{align-self:center}.nw.p2{align-self:flex-end;margin-right:6%}
.steps{display:flex;gap:9px;justify-content:center;opacity:.85}
.steps span{width:9px;height:9px;border-radius:50%;background:#fff}
.node{position:relative;width:76px;height:76px;border-radius:50%;background:#fff;color:var(--ink);font-weight:900;font-size:28px;display:grid;place-items:center;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.12),0 6px 0 rgba(31,42,92,.22);transition:transform .15s}
.node:active{transform:scale(.93)}
.node.done{background:linear-gradient(180deg,#FFE066,#FFB21E);color:#7A4A00}
.node.cur{background:linear-gradient(180deg,#FF8A3D,#FF4F8B);color:#fff;animation:pulse 1.5s ease-in-out infinite}
.node.lock{background:rgba(255,255,255,.6);color:#97A0C4;font-size:24px}
.node.boss{width:88px;height:88px;font-size:38px}
.node.boss:not(.lock){background:linear-gradient(180deg,#8E6BFF,#5131D6);color:#fff}
.node.boss.done{background:linear-gradient(180deg,#FFE066,#FFB21E)}
@keyframes pulse{50%{transform:scale(1.08)}}
.nlbl{font-size:12.5px;font-weight:800;background:rgba(255,255,255,.95);border-radius:10px;padding:3px 8px;text-align:center;line-height:1.2;box-shadow:0 2px 0 rgba(31,42,92,.12)}
.nst{font-size:14px;letter-spacing:1px;min-height:18px}
.dim{opacity:.28;filter:grayscale(1)}
.mini{position:absolute;right:-50px;top:4px}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

/* day screen */
.gtop{display:flex;align-items:center;gap:8px}
.gtitle{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(31,42,92,.3);flex:1;min-width:0;line-height:1.15}
.gtitle small{display:block;font-family:var(--body);font-size:14px;font-weight:800;opacity:.95}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ad{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.4);display:grid;place-items:center;font-size:17px;transition:all .3s}
.ad.done{background:var(--sun)}
.ad.now{background:#fff;transform:scale(1.15);box-shadow:0 3px 0 rgba(31,42,92,.2)}
.row2{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:30px}
.rdots{display:flex;gap:5px;flex-wrap:wrap}
.rdots span{width:20px;height:9px;border-radius:5px;background:rgba(255,255,255,.45)}
.rdots span.done{background:var(--sun)}.rdots span.now{background:#fff}
.combo{font-weight:900;font-size:15px;color:#fff;background:var(--coral);border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 rgba(31,42,92,.15);white-space:nowrap}
.combo.hot{animation:win .5s}
.card{background:var(--card);border-radius:28px;padding:20px 16px 22px;box-shadow:0 8px 0 rgba(31,42,92,.2);display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;min-width:0}
.qa{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.ask{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--muted);text-align:center;text-wrap:balance}
.say{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:18px;display:grid;place-items:center}
.tbar{position:absolute;top:-20px;left:8px;right:8px;height:6px;border-radius:0 0 6px 6px;background:var(--soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sun);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.pic{font-size:90px;line-height:1.1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.sentence{font-weight:900;font-size:29px;line-height:1.3;text-align:center;text-wrap:balance}
.rv-word{font-weight:900;font-size:54px;letter-spacing:4px;text-align:center;overflow-wrap:anywhere;max-width:100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.rv-pic{font-size:96px;line-height:1.1;min-height:106px;display:grid;place-items:center}
.rv-pic.hid{color:var(--line);font-family:var(--display);font-weight:700}
.story{font-weight:800;font-size:22px;line-height:1.5;background:#FFF8E1;border-radius:20px;padding:14px 16px;width:100%}
.storyq{font-weight:900;font-size:23px;text-align:center;color:var(--grape)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:72px;border-radius:20px;background:var(--soft);font-weight:900;font-size:34px;letter-spacing:2px;color:var(--ink);
  box-shadow:inset 0 -6px 0 var(--line);transition:transform .1s;animation:pop .4s backwards;padding:6px 10px;overflow-wrap:anywhere}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--grass);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);animation:win .5s}
.opt.bad{background:#FFE2DF;color:#E2928A;box-shadow:none;animation:shake .4s}
.opt.emo{font-size:54px}
.opt.yes{background:var(--grass);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.opt.no{background:var(--coral);color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.opt.yes.bad,.opt.no.bad{opacity:.4}
@keyframes win{40%{transform:scale(1.12) rotate(-3deg)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.glue{display:flex;align-items:center;gap:10px;font-weight:900;font-size:42px;flex-wrap:wrap;justify-content:center}
.glue .c1{background:var(--coral);color:#fff;border-radius:16px;padding:4px 16px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.glue .c2{background:#3D74F0;color:#fff;border-radius:16px;padding:4px 16px;letter-spacing:2px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.glue .op{color:var(--muted);font-size:34px}
.q{border:3px dashed var(--grape);color:var(--grape);border-radius:16px;padding:0 18px;min-width:70px;text-align:center}
.q.filled{border-style:solid;background:var(--grass);border-color:var(--grass);color:#fff;animation:pop .35s}

.ladder{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.lstep{font-weight:900;font-size:38px;letter-spacing:3px;border-radius:18px;padding:8px 22px;background:var(--soft);box-shadow:inset 0 -6px 0 var(--line);animation:pop .4s;min-width:120px;color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.lstep .n{color:var(--coral)}
.lstep.read{background:#E2F8EC;box-shadow:inset 0 -6px 0 #BCEBD2}
.lstep.cur{outline:4px solid var(--sun);animation:pop .4s,nudge 1.4s 1s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.05)}}
.lhint{font-weight:800;color:var(--muted);text-align:center;font-size:15px;max-width:34ch}
.arrow{color:var(--line);font-size:20px;line-height:.6}

.flash{font-weight:900;font-size:50px;letter-spacing:3px;min-height:80px;display:grid;place-items:center;text-align:center;width:100%}
.flash .hid{color:var(--line)}
.speed{font-weight:900;color:var(--grape);background:#F1EAFF;border-radius:999px;padding:4px 12px;font-size:15px}
.again{font-weight:800;color:#3D74F0;background:var(--soft);border-radius:999px;padding:8px 14px}

.tgrid{display:grid;gap:6px;width:100%}

const LV=d=>d<10?0:d<20?1:2;
const TEMPOS=[[1,'обычный'],[1.5,'×1,5'],[2,'×2'],[3,'×3'],[4,'×4']];
const K=()=>S.tempo||1;   // во сколько раз медленнее
const TIMED=['schulte','flash','pairs','search','wide','pacer','timed','errors','boss'];
function tempoHTML(){return `<div class="tempo"><span>🐢 Медленнее:</span>${TEMPOS.map(([v,l])=>`<button data-t="${v}" class="${K()===v?'on':''}">${l}</button>`).join('')}</div>`}
function bindTempo(onChange){$$('#card .tempo button').forEach(b=>b.onclick=()=>{S.tempo=+b.dataset.t;save();sfx.tap();$$('#card .tempo button').forEach(x=>x.classList.toggle('on',x===b));
  toast(S.tempo===1?'Обычный темп':'Медленнее в '+String(S.tempo).replace('.',',')+' раза');onChange&&onChange()})}
function textFor(d,k){return TEXTS[LV(d)*10+((d%10)+k)%10]}
const wc=t=>t.split(/\s+/).filter(w=>/[а-яё]/i.test(w)).length;
function grpsFor(){const L=LV(G.d);return L===0?GROUPS.slice(0,16):L===1?GROUPS.slice(14):PGROUPS.concat(GROUPS.slice(20))}
const RUN={};
function presentQ(box,q,onRight,onWrong){
  const fw=q.fast?q.fast*K():0;
  box.innerHTML=(fw?`<div class="tbar"><i style="animation-duration:${fw}ms"></i></div>`:'')+q.top+
    `<div class="opts ${q.cols||''}">${q.opts.map(o=>`<button class="opt ${o.c||''}" data-v="${o.v}">${o.l}</button>`).join('')}</div>`;
  const t0=performance.now();let lock=false;G.q=q;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(lock||b.disabled)return;
    if(b.dataset.v===String(q.ans)){lock=true;b.classList.add('ok');correct(b,q.spoken,fw&&performance.now()-t0<fw);later(onRight,1300)}
    else{b.classList.add('bad');b.disabled=true;wrong();onWrong&&onWrong(box)}});
}

RUN.schulte=()=>{
  const n=G.d<5?3:G.d<15?4:5,N=n*n;let tab=0;const times=[];
  const COLS=['#FFE3E3','#E3F2FF','#E6F9E8','#FFF4CC','#F1E6FF','#FFE6F4'];
  const one=()=>{rdots(tab,2);let next=1;const nums=shuffle(Array.from({length:N},(_,i)=>i+1));
    card(askHTML('schulte')+`<div class="target">Найди: <b id="schN">1</b> · <span id="schT">0,0 с</span></div>
      <div class="sch" style="grid-template-columns:repeat(${n},1fr);font-size:${n===5?22:n===4?27:34}px">${nums.map(x=>`<button data-n="${x}" style="background:${pick(COLS)}">${x}</button>`).join('')}</div>
      <div class="rec">${S.rec['sch'+n]?'Рекорд: '+fmtT(S.rec['sch'+n]):'Поставь первый рекорд!'}</div>`+tempoHTML());bindTempo();
    const t0=performance.now(),iv=setInterval(()=>{const e=$('#schT');if(e)e.textContent=fmtT(performance.now()-t0)},100);G.clean.push(()=>clearInterval(iv));
    G.sch={get next(){return next}};
    $$('#card .sch button').forEach(b=>b.onclick=()=>{const v=+b.dataset.n;
      if(v===next){b.classList.add('ok');sfx.tap();next++;$('#schN').textContent=next<=N?next:'✓';
        if(next>N){clearInterval(iv);const ms=performance.now()-t0,rk='sch'+n,nr=!S.rec[rk]||ms<S.rec[rk];times.push(ms/N);if(nr)S.rec[rk]=Math.round(ms);
          S.coins+=3;G.coins+=3;save();updCoins();bumpCoins();toast(nr?'Новый рекорд! ⚡ +3 🪙':'Готово! +3 🪙');heroDo($('#gH'),'happy',900);sfx.ok();tab++;
          later(()=>{if(tab<2)one();else{const a=times.reduce((x,y)=>x+y,0)/times.length/1000,lim=(n===3?[2,3.5]:n===4?[2.2,3.8]:[2.5,4.2]).map(x=>x*K());actEnd(a<=lim[0]?3:a<=lim[1]?2:1)}},1200)}}
      else if(!b.classList.contains('ok')){b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');G.am++;sfx.bad()}})};
  one()};

RUN.pacer=()=>{const [t,q1]=textFor(G.d,5);const words=t.split(/\s+/),base=40+G.d*2;
  const wpmNow=()=>Math.max(8,Math.round(Math.max(30,Math.min(160,base+(S.paceAdj||0)))/K()));
  card(askHTML('pacer')+tempoHTML()+`<div class="pacebar"><button class="again" id="slower">🐢 Медленнее</button><b id="wpmv">${wpmNow()} сл/мин</b><button class="again" id="faster">🐇 Быстрее</button></div>
    <div class="ptext" id="pt">${words.map((w,k)=>`<span>${w}</span>`).join(' ')}</div><button class="bigbtn" id="pgo">▶ Старт</button>`);
  const sp=$$('#pt span');let k=0,run=false,tm=0;
  const upd=d=>{S.paceAdj=(S.paceAdj||0)+d;save();$('#wpmv').textContent=wpmNow()+' сл/мин';sfx.tap()};
  $('#slower').onclick=()=>upd(-5);$('#faster').onclick=()=>upd(5);bindTempo(()=>{$('#wpmv').textContent=wpmNow()+' сл/мин'});
  const finish=()=>{run=false;S.coins+=3;G.coins+=3;save();updCoins();bumpCoins();sfx.ok();toast('Дочитал! +3 🪙');
    later(()=>{const [qq,r,...w]=q1;card(`<div class="ask">Вопрос по рассказу</div><div class="qa" id="qa"></div>`);
      presentQ($('#qa'),{top:`<div class="storyq">${qq}</div>`,opts:shuffle([r,...w]).map(x=>({v:x,l:x,c:'sm'})),cols:'one',ans:r,spoken:r},()=>actEnd(G.am===0?3:2))},1000)};
  const tick=()=>{if(!run)return;if(k>0)sp[k-1].className='read';if(k>=sp.length)return finish();sp[k].className='on';
    const w=words[k];k++;tm=setTimeout(tick,60000/wpmNow()*Math.max(.55,Math.min(1.8,.45+w.length/11)))};
  G.clean.push(()=>{run=false;clearTimeout(tm)});G.pskip=()=>{run=false;clearTimeout(tm);finish()};
  $('#pgo').onclick=()=>{sfx.tap();run=!run;$('#pgo').textContent=run?'⏸ Пауза':'▶ Дальше';if(run)tick();else clearTimeout(tm)}};

RUN.timed=()=>{const [t,qa,qb]=textFor(G.d,0),n=wc(t);let target=Math.round((40+G.d*2)/K());
  card(askHTML('timed')+tempoHTML()+`<div class="intro"><div class="big">📖</div><p>В рассказе ${n} слов. Нажми «Старт» и читай. Как закончишь, сразу нажимай «Прочитал!»</p><p id="tgt">Цель дня: ${target} слов в минуту</p></div><button class="bigbtn" id="tgo">▶ Старт</button>`);
  bindTempo(()=>{target=Math.round((40+G.d*2)/K());$('#tgt').textContent='Цель дня: '+target+' слов в минуту'});
  $('#tgo').onclick=()=>{sfx.tap();try{speechSynthesis.cancel()}catch(e){}const t0=performance.now();
    card(`<div class="clock" id="tclk">0,0 с</div><div class="story">${t}</div><button class="bigbtn" id="tdone">✓ Прочитал!</button>`);
    const iv=setInterval(()=>{const e=$('#tclk');if(e)e.textContent=fmtT(performance.now()-t0)},100);G.clean.push(()=>clearInterval(iv));
    $('#tdone').onclick=()=>{clearInterval(iv);const ms=performance.now()-t0,wpm=Math.round(n/(ms/60000));G.tw={wpm};
      const qs=[qa,qb].map(([qq,r,...w])=>({top:`<div class="storyq">${qq}</div>`,opts:shuffle([r,...w]).map(x=>({v:x,l:x,c:'sm'})),cols:'one',ans:r,spoken:r}));
      let qi=0,right=0;
      const ask=()=>{card(`<div class="ask">Вопрос ${qi+1} из 2</div><div class="qa" id="qa"></div>`);const before=G.am;
        presentQ($('#qa'),qs[qi],()=>{if(G.am===before)right++;qi++;if(qi<2)ask();else result()})};
      const result=()=>{const ok=wpm<=300,prev=S.wpmBest||0,rec=ok&&right===2&&wpm>prev;
        if(ok){S.wpm=(S.wpm||[]).concat([{d:G.d+1,w:wpm,r:right,t:todayStr()}]).slice(-60);if(rec)S.wpmBest=wpm}
        const st=1+(right===2?1:0)+(ok&&wpm>=target?1:0),earn=rec?8:3;S.coins+=earn;G.coins+=earn;save();updCoins();
        card(`<div class="intro"><div id="aHero">${heroHTML(100)}</div><div class="wpm">${ok?wpm:'—'}<small> слов в минуту</small></div>
          <p>${!ok?'Ого, очень быстро! Похоже, кнопку нажали раньше времени. В следующий раз прочитай внимательно.':right<2?'Скорость есть, но в ответах ошибки. Читай чуть внимательнее!':rec?`Новый рекорд! 🎉 +${earn} 🪙`:`Отлично! Цель дня: ${target} сл/мин. +${earn} 🪙`}</p></div>
          <button class="bigbtn" id="tnext">Дальше ▶</button>`);
        paintHeroes();heroDo($('#aHero .hero-w'),rec||right===2?'happy':'sad',1200);if(rec){confetti(120);sfx.win();say('Новый рекорд! '+wpm+' слов в минуту!')}
        $('#tnext').onclick=()=>{sfx.tap();actEnd(st)}};
      ask()}}};

RUN.errors=()=>{const L=LV(G.d),pool=L===0?ERRS[0]:L===1?ERRS[1].concat(shuffle(ERRS[0]).slice(0,4)):ERRS[2].concat(shuffle(ERRS[1]).slice(0,4));
  const list=shuffle(pool).slice(0,6);let i=0;
  const step=()=>{rdots(i,list.length);const [s,bad,good]=list[i],ws=s.split(' ');G.err={bad};
    const fw=8000*K();card(askHTML('errors')+tempoHTML()+`<div class="qa"><div class="tbar"><i style="animation-duration:${fw}ms"></i></div><div class="chips">${ws.map(w=>`<button data-w="${w.replace(/[,.]/g,'')}">${w}</button>`).join('')}</div></div>`);
    const t0=performance.now();let done=false;
    bindTempo();$$('#card .chips button').forEach(b=>b.onclick=()=>{if(done)return;
      if(b.dataset.w===bad){done=true;b.classList.add('ok');b.textContent=good;correct(b,'',performance.now()-t0<fw);say(s.replace(bad,good));later(()=>{i++;if(i<list.length)step();else actEnd()},1600)}
      else{b.classList.add('bad');b.disabled=true;wrong()}})};
  step()};

RUN.order=()=>{const list=shuffle(ORDERS[LV(G.d)]).slice(0,4);let i=0;
  const step=()=>{rdots(i,list.length);const ws=list[i].split(' ');let pos=0;G.ord={ws,get pos(){return pos}};
    card(askHTML('order')+`<div class="oline" id="ol"></div><div class="chips" id="oc">${shuffle(ws).map(w=>`<button data-w="${w}">${w}</button>`).join('')}</div>`);
    $$('#oc button').forEach(b=>b.onclick=()=>{if(b.style.visibility==='hidden')return;
      if(b.dataset.w===ws[pos]){b.style.visibility='hidden';$('#ol').insertAdjacentHTML('beforeend',`<span>${ws[pos]}</span>`);pos++;sfx.tap();
        if(pos===ws.length){G.combo++;S.coins+=2;G.coins+=2;save();sfx.ok();feed($('#ol'),'');toast(pick(PRAISE));updCombo();say(list[i]);later(()=>{i++;if(i<list.length)step();else actEnd()},1700)}}
      else{b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:250});wrong()}})};
  step()};

RUN.boss=()=>{const lvl=DAYS[G.d].boss,HP=8+lvl*2;let hp=HP;
  card(askHTML('boss')+`<div class="arena"><div id="bH">${heroHTML(84)}</div><div class="hpbox">Зевака<div class="hp"><i id="hpI" style="width:100%"></i></div><span id="hpN">${hp} / ${HP}</span></div>
    <div class="boss-w" id="boss" style="width:${96+lvl*8}px;height:${96+lvl*8}px">${BOSS_SVG}</div></div>`+tempoHTML()+`<div class="qa" id="qa"></div>`);
  paintHeroes();bindTempo();
  const mk=()=>{const t=pick(['pair','pick','pick','err']),gs=grpsFor();
    if(t==='pair'){const g=pick(gs),a=pick(g),same=Math.random()<.5,b=same?a:pick(g.filter(x=>x!==a));
      return{top:`<div class="pair"><span>${F(a)}</span><span>${F(b)}</span></div>`,opts:[{v:'1',l:'Одинаковые',c:'yes sm'},{v:'0',l:'Разные',c:'no sm'}],ans:same?'1':'0',spoken:'',fast:4000}}
    if(t==='err'){const [s,bad]=pick(ERRS[LV(G.d)]),ws=s.split(' ').map(w=>w.replace(/[,.]/g,''));
      return{top:`<div class="storyq">Какое слово неправильное?</div><div class="sentence" style="font-size:22px">${s}</div>`,opts:shuffle([bad,...shuffle(ws.filter(w=>w!==bad)).slice(0,2)]).map(x=>({v:x,l:x,c:'sm'})),cols:'one',ans:bad,spoken:'',fast:7000}}
    const g=pick(gs),w=pick(g);return{top:`<div class="storyq">Где написано «${F(w)}»?</div>`,opts:shuffle(g).map(x=>({v:x,l:F(x),c:x.length>9?'sm':''})),cols:g[0].length>9?'one':'',ans:w,spoken:w,fast:4000}};
  const sleepy=box=>{const s=document.createElement('div');s.innerHTML=INK;const ink=s.firstElementChild;box.appendChild(ink);setTimeout(()=>ink.remove(),1100);heroDo($('#bH .hero-w'),'sad',900)};
  const ask=()=>presentQ($('#qa'),mk(),hit,sleepy);
  const hit=()=>{const h=$('#bH').getBoundingClientRect(),b=$('#boss').getBoundingClientRect(),s=document.createElement('div');s.className='shot';s.textContent='⚡';document.body.appendChild(s);
    s.style.left=(h.left+h.width/2)+'px';s.style.top=(h.top+h.height/3)+'px';heroDo($('#bH .hero-w'),'happy',700);
    s.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${b.left-h.left}px,${b.top-h.top}px) rotate(540deg)`}],{duration:420,easing:'ease-in'}).onfinish=()=>{s.remove();if(!G||G.act!=='boss')return;sfx.zap();
      hp--;$('#hpI').style.width=(Math.max(0,hp)/HP*100)+'%';$('#hpN').textContent=`${Math.max(0,hp)} / ${HP}`;const bw=$('#boss');bw.classList.remove('hit');void bw.offsetWidth;bw.classList.add('hit');rdots(HP-hp,HP);
      if(hp<=0){bw.classList.add('dead');confetti(160);sfx.win();say('Ура! Зевака прогнан!');later(()=>actEnd(G.am<=2?3:G.am<=5?2:1),1600)}else later(ask,350)}};
  rdots(0,HP);later(ask,200)};

function runQuiz(qs){card(askHTML(G.act)+tempoHTML()+'<div class="qa" id="qa"></div>');bindTempo();let i=0;
  const step=()=>{rdots(i,qs.length);presentQ($('#qa'),qs[i],()=>{i++;if(i>=qs.length)actEnd();else step()})};step()}

['У Тимы появился робот-пылесос. Тима назвал его Жужа. Каждое утро Жужа выезжал из своего домика и убирал комнату. Однажды он заехал под кровать и не вернулся. Тима заглянул туда и рассмеялся: Жужа застрял между тапками и старым мячом. Тима освободил робота, а тот радостно пискнул и поехал дальше, будто ничего не случилось.',['Как звали робота?','Жужа','Бублик','Шустрик'],['Где застрял робот?','под кроватью','в шкафу','на кухне']],

['Папа принёс домой круглый аквариум и трёх рыбок: золотую, полосатую и маленькую синюю. Аня насыпала на дно разноцветные камешки и посадила водоросли. Рыбки сразу начали играть в догонялки. Синяя рыбка оказалась самой быстрой и всегда первой подплывала к корму. Аня назвала её Молния.',['Сколько рыбок принёс папа?','три','две','пять'],['Как назвали синюю рыбку?','Молния','Звёздочка','Капелька']],
['Осенью бабушка вырастила на огороде огромную тыкву. Мурчик решил, что это его новый домик. Он залез наверх и устроился греться на солнышке. Вечером бабушка позвала его ужинать, но котёнок так крепко спал, что ничего не слышал. Пришлось бабушке нести в дом и тыкву, и Мурчика сразу.',['Где устроился Мурчик?','на тыкве','в корзине','на крыше'],['Что пришлось нести бабушке?','тыкву и Мурчика','только тыкву','дрова']],
['Лёва долго учился кататься на двухколёсном велосипеде. Он падал, вставал и снова садился. Папа бежал рядом и придерживал седло. Однажды Лёва оглянулся и увидел, что папа стоит далеко позади и машет ему рукой. Оказалось, что Лёва уже давно едет сам! От радости он позвонил в звонок три раза.',['Кто придерживал седло?','папа','мама','брат'],['Сколько раз Лёва позвонил в звонок?','три раза','один раз','пять раз']],
['В детском саду готовили кукольный театр. Маша была лисой, Петя волком, а Даня зайцем. Целую неделю ребята учили слова и шили костюмы куклам. В день спектакля пришли все мамы и папы. Когда зайчик обхитрил волка, зрители громко захлопали. А после спектакля всех угостили пирогом с вишней.',['Кем была Маша?','лисой','зайцем','волком'],['Каким пирогом угостили?','с вишней','с яблоком','с капустой']],

['Мама пекла печенье, а Мурчик сидел на табуретке и внимательно следил. Когда мама отвернулась, котёнок решил помочь и потрогал лапкой муку. Мука взлетела белым облаком! Мурчик чихнул и стал похож на маленькое привидение. Мама засмеялась и сказала, что теперь у неё есть помощник, которого видно даже в темноте.',['Что пекла мама?','печенье','торт','хлеб'],['На кого стал похож Мурчик?','на привидение','на снеговика','на зайца']],

['Однажды хозяйка повезла Мурчика на выставку кошек. Там были пушистые персидские коты, лысые сфинксы и огромные мейн-куны размером с собаку. Мурчик сначала испугался и спрятался в переноску. Но потом увидел, что судьи гладят котов и дают им вкусняшки. Он вышел, распушил свой радужный хвост и важно прошёлся по столу. Мурчику вручили медаль «Самый яркий кот выставки».',['Куда спрятался Мурчик?','в переноску','под стол','в сумку'],['Какую медаль получил Мурчик?','«Самый яркий кот выставки»','«Самый пушистый кот»','«Самый быстрый кот»']],

['Зимой Вика решила устроить огород прямо на подоконнике. Она взяла несколько стаканчиков, насыпала землю и посадила семена лука, укропа и гороха. Каждый день девочка поливала их из маленькой лейки и записывала в тетрадь, что изменилось. Через неделю появились первые зелёные ростки. А когда на улице ещё лежал снег, Вика угостила всю семью свежим зелёным луком.',['Где Вика устроила огород?','на подоконнике','на балконе','на даче'],['Чем Вика угостила семью?','зелёным луком','клубникой','горохом']],

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n=140){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FF5A5F','#FFC530','#2FD07A','#8B5CFF','#12C6E0','#FF5FB0'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.4,l:0});
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+40&&p.l<260);raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

    if(!pool.length){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent='Все доступные вещи уже твои! Новые откроются, когда пройдёшь больше дней 🔒';return}
    if(S.coins<SURPRISE){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent=`Для сюрприза нужно ещё ${SURPRISE-S.coins} 🪙. Играй и собирай монетки!`;return}
    ask(`Открыть сюрприз за <b>${SURPRISE} 🪙</b>?<small>Останется ${S.coins-SURPRISE} 🪙</small>`,'Открыть 🎁',()=>{const [t,it]=pick(pool);
      S.coins-=SURPRISE;S.own.push(t+':'+it.id);S[SHOP[t].k]=it.id;save();updCoins();sfx.coin();confetti(150);
      showOv(`<h2>Сюрприз!</h2><div class="chest open" style="font-size:96px">${it.e}</div><p style="font-weight:900;font-size:22px;margin:0">${it.n}</p><p style="font-weight:800;color:var(--muted);margin:0">Уже надето! Можно поменять в гардеробе.</p><div class="btns"><button class="bigbtn" id="surpOk">Ура! 🎉</button></div>`);
      say('Ура! Тебе выпало: '+it.n);$('#surpOk').onclick=()=>{sfx.tap();openShop(t)}})};
  $$('#panel .item').forEach(b=>b.onclick=()=>{const it=L.find(x=>x.id===b.dataset.id);
    $$('#panel .item').forEach(x=>x.classList.remove('try'));b.classList.add('try');
    if(C.food){sfx.tap();
      if(S.full>=FULLMAX){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent='Мурчик уже сыт! Мур-р-р 😊 Покорми его завтра.';say('Я уже сыт!');return}
      if(S.coins<it.p)return noMoney(it,'Чтобы купить');
      ask(`Покормить Мурчика: ${it.e} ${it.n} за <b>${it.p} 🪙</b>?<small>Останется ${S.coins-it.p} 🪙</small>`,'Покормить',()=>{
        S.coins-=it.p;S.full=Math.min(FULLMAX,S.full+it.f);S.fullDay=S.fullDay||todayStr();save();updCoins();sfx.coin();
        const h=$('#shopHero .hero-w'),r=h.getBoundingClientRect(),fl=document.createElement('div');fl.className='fly';fl.style.fontSize='46px';fl.textContent=it.e;
        fl.style.left=(innerWidth/2-23)+'px';fl.style.top=(innerHeight-200)+'px';document.body.appendChild(fl);
        fl.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${r.left+r.width/2-innerWidth/2}px,${r.top+r.height*.62-(innerHeight-200)}px) scale(.3)`}],{duration:650,easing:'ease-in'}).onfinish=()=>{fl.remove();
          heroDo(h,'eat',600);sfx.chomp();setTimeout(()=>{heroDo(h,'happy',1000);confetti(40);say(pick(['Мур-р-р! Спасибо!','Вкуснятина!','Ммм, как вкусно!']))},600);
          setTimeout(()=>openShop('f'),1700)}});
      return}
    const key=tab+':'+it.id;
    if(C.room&&S.own.includes(key)){sfx.tap();$('#shopMsg').textContent=`«${it.n}» уже стоит в домике Мурчика 🏠`;return}
    if(S.own.includes(key)){sfx.tap();S[C.k]=it.id;save();openShop(tab);heroDo($('#shopHero .hero-w'),'happy',900);return}
    if(tab==='b')$('#shopHero').style.background=it.bg;else if(!C.room)paintHeroes({[tab]:it.id});heroDo($('#shopHero .hero-w'),'happy',700);sfx.tap();
    if(it.gift){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent=`Это особый подарок 🎁 Его нельзя купить. Он придёт сам, когда пройдёшь день ${it.gift}!`;return}
    if(locked(it)){$('#buyBox').hidden=true;$('#shopBtns').hidden=false;$('#shopMsg').textContent=`Это примерка 👀 «${it.n}» откроется после дня ${it.d}.`;return}
    if(S.coins<it.p)return noMoney(it,'Это примерка 👀 Чтобы купить');
    $('#shopMsg').textContent='Это примерка 👀';
    ask(`Купить «${it.n}» за <b>${it.p} 🪙</b>?<small>После покупки останется ${S.coins-it.p} 🪙</small>`,'Купить',()=>{S.coins-=it.p;S.own.push(key);if(C.k)S[C.k]=it.id;save();updCoins();sfx.coin();confetti(60);say('Ура! Спасибо!');openShop(tab);heroDo($('#shopHero .hero-w'),'happy',900)})});
  $('#shopClose').onclick=()=>{hideOv();if(!G)renderHome();else paintHeroes()};
}
let resetArm=false;
function speedBars(){const h=(S.wpm||[]).slice(-14);if(!h.length)return '<p style="color:var(--muted)">Здесь появится график, когда ребёнок пройдёт «Чтение на время».</p>';
  const mx=Math.max(...h.map(x=>x.w),60);return `<div class="bars">${h.map(x=>`<div><b>${x.w}</b><i style="height:${Math.round(x.w/mx*100)}%;${x.r<2?'opacity:.45':''}"></i>д.${x.d}</div>`).join('')}</div><p style="font-size:14px;color:var(--muted)">Слов в минуту в упражнении «Чтение на время». Бледные столбики: были ошибки в вопросах.</p>`}
function openInfo(){
  const wk=[['Дни 1–10','Короткие рассказы (30–40 слов), таблицы Шульте 3×3 и 4×4, короткие похожие слова. Цель: 40–60 слов в минуту.'],
    ['Дни 11–20','Рассказы по 50–65 слов, таблицы 4×4 и 5×5, длинные слова, ошибки по смыслу. Цель: 60–80 слов в минуту.'],
    ['Дни 21–30','Большие рассказы (70–90 слов), таблицы 5×5, целые фразы во «Вспышке». Цель: 80–100 слов в минуту.'],['Каждый 7-й день','Битва с сонным Зевакой: быстрые вопросы на внимание.']];
  showOv(`<h2>Для родителей</h2><div class="info">
    <p>Тренажёр для ребёнка, который уже уверенно читает. <b>30 дней по ~15 минут</b>. Каждый день 4–6 упражнений, нагрузка растёт постепенно.</p>
    <h3>Скорость чтения</h3>${speedBars()}
    <div class="weeks">${wk.map(([a,b])=>`<div><b>${a}.</b> ${b}</div>`).join('')}</div>
    <h3>Что тренирует каждое упражнение</h3>
    <div class="weeks"><div><b>🔢 Таблица Шульте</b> расширяет поле зрения: смотреть в центр, а числа искать «краем глаза».</div>
    <div><b>⚡ Вспышка, 👀 Пары, 🔍 Найди слово</b> учат узнавать слово целиком с одного взгляда, а не по буквам.</div>
    <div><b>🔭 Широкий взгляд</b> учит видеть сразу несколько слов в строке.</div>
    <div><b>🐾 Догони лапку</b> задаёт ровный темп и отучает возвращаться глазами назад. Лучше читать вслух, а вам слушать рядом. Темп меняется кнопками 🐢 и 🐇.</div>
    <div><b>🕵️ Найди ошибку, 🧩 Собери предложение</b> не дают читать «по диагонали»: важно понимать смысл.</div>
    <div><b>⏱️ Чтение на время</b> измеряет скорость в словах в минуту. После текста два вопроса на понимание. Рекорд засчитывается, только если оба ответа верные.</div></div>
    <p>Рассказы иногда повторяются через несколько дней. Это нормально: повторное чтение знакомого текста тоже ускоряет чтение.</p>
    <h3>Озвучка</h3>
    <label class="toggle"><input type="checkbox" id="voiceT" ${S.voiceOn?'checked':''}> Читать вслух задания</label>
    <div id="voiceBox" ${S.voiceOn?'':'hidden'} style="display:flex;flex-direction:column;gap:8px">
      ${ruVoices.length?`<select id="voiceSel" style="font:inherit;font-weight:800;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)">${ruVoices.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${ruVoice&&v.name===ruVoice.name?'selected':''}>${v.name}</option>`).join('')}</select>
      <button class="bigbtn alt" id="voiceTry">▶ Послушать голос</button>
      <p style="color:var(--muted);font-size:14px">Голоса берутся из телефона. Лучше всего звучат голоса с пометкой «улучшенный», Enhanced, Premium или Natural. На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → Русский.</p>`
      :'<p style="color:var(--muted)">На этом устройстве не найден русский голос.</p>'}
    </div>
    <h3>Темп упражнений</h3>
    <p>Если ребёнку не хватает времени, замедлите все упражнения на время: слова дольше видны, больше секунд на пары, «лапка» идёт медленнее, а цели и звёзды мягче. Переключатель есть и внутри каждого упражнения.</p>
    ${tempoHTML()}
    <h3>Настройки</h3>
    <label class="toggle"><input type="checkbox" id="lowerT" ${S.lower?'checked':''}> Писать слова в упражнениях маленькими буквами</label>
    <label class="toggle"><input type="checkbox" id="dailyT" ${S.daily?'checked':''}> Открывать не больше одного нового дня в сутки</label>
    <button class="bigbtn alt" id="resetB">Сбросить весь прогресс</button></div>
    <div class="btns"><button class="bigbtn" id="infoClose">Закрыть</button></div>`);
  $$('#panel .tempo button').forEach(x=>x.onclick=()=>{S.tempo=+x.dataset.t;save();sfx.tap();$$('#panel .tempo button').forEach(y=>y.classList.toggle('on',y===x))});
  $('#dailyT').onchange=e=>{S.daily=e.target.checked;save()};
  $('#lowerT').onchange=e=>{S.lower=e.target.checked;save()};
  $('#voiceT').onchange=e=>{S.voiceOn=e.target.checked;save();$('#voiceBox').hidden=!S.voiceOn;document.body.classList.toggle('novoice',!S.voiceOn);if(S.voiceOn)say('Привет! Я Мурчик. Давай читать быстро!')};
  if($('#voiceSel'))$('#voiceSel').onchange=e=>{S.voiceName=e.target.value;save();loadVoice();say('Привет! Я Мурчик. Давай читать быстро!',1)};
  if($('#voiceTry'))$('#voiceTry').onclick=()=>say('Привет! Я Мурчик. Давай читать быстро!',1);
  $('#resetB').onclick=e=>{if(!resetArm){resetArm=true;e.target.textContent='Точно? Нажмите ещё раз';e.target.style.background='#FFD9D6';setTimeout(()=>{resetArm=false},3000);return}
    const keep={sound:S.sound,music:S.music,lower:S.lower,voiceOn:S.voiceOn,voiceName:S.voiceName,daily:S.daily};
    S={days:{},coins:0,flashT:900,wideT:1500,rec:{},own:['s:rainbow','h:','g:','a:','p:','b:'],skin:'rainbow',hat:'',gl:'',acc:'',pet:'',bg:'',prog:null,time:{d:'',ms:0},tip:0,full:3,fullDay:todayStr(),wpm:[],wpmBest:0,paceAdj:0,...keep};
    save();resetArm=false;hideOv();renderHome()};
  $('#infoClose').onclick=()=>{hideOv();renderHome()};
}
$('#shopBtn').onclick=()=>{sfx.tap();openShop()};
$('#infoBtn').onclick=()=>{sfx.tap();openInfo()};
function syncBtns(){$('#sndBtn').textContent=S.sound?'🔊':'🔇';$('#musBtn').classList.toggle('off',!S.music);$('#musBtn').setAttribute('aria-label',S.music?'Выключить музыку':'Включить музыку');}
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();syncBtns();sfx.tap()};
$('#musBtn').onclick=()=>{S.music=!S.music;save();syncBtns();if(S.music)Music.play(musicWanted);else Music.stop()};

document.addEventListener('visibilitychange',()=>{if(document.hidden)Music.stop();else if(S.music&&AC)Music.play(musicWanted)});
setInterval(()=>{if(G&&!document.hidden&&!$('#dayScreen').hidden){todayMs();S.time.ms+=1000;if(S.time.ms%10000===0)save()}},1000);
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight});
window.__chit={get G(){return G},S:()=>S,DAYS};
syncBtns();renderHome();

</script>


<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
